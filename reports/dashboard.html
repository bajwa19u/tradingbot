<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<title>Trading Bot Analytics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: a light corporate report. One header with two pages and a single
   filter bar; summaries first, detail opens in place on click. Navy ink, one
   restrained blue accent; green and red only on results. Light by design. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --subtle: #f9fafb; --line: #e4e7ec; --line-2: #cdd3db;
  --ink: #172133; --muted: #5a6575; --faint: #8b94a2;
  --accent: #2557c4; --accent-soft: #edf2fc;
  --up: #1d7a4e; --up-soft: #e6f3ec; --down: #b5373c; --down-soft: #fbeaea;
  --warn: #8f5d00; --warn-soft: #fbf2de;
  --s-daytrade: #2a78d6; --s-inplay: #e0662f; --s-swing: #6250d6; --s-all: #172133;
  --sans: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
h1 { font-size: 18px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
p { margin: 0; }
button, select, input { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .faint { color: var(--faint); }
.num { text-align: right; white-space: nowrap; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px 28px; flex-wrap: wrap; min-height: 58px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 5px; background: var(--ink); display: grid; place-items: center; }
.brand i::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: translateY(-1px) skewY(-25deg); }
nav.tabs { display: flex; gap: 4px; align-self: stretch; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 4px; margin: 0 8px; color: var(--muted); cursor: pointer; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.meta { margin-left: auto; color: var(--faint); font-size: 13px; text-align: right; }

/* filters */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 16px 6px; }
.fld { display: flex; align-items: center; gap: 8px; }
.fld[hidden] { display: none; }
.fld > label { font-size: 13px; color: var(--muted); }
select, input[type="date"], input[type="search"] { background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px; min-width: 0; max-width: 100%; }
input[type="search"] { width: 170px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-left: 1px solid var(--line); padding: 6px 11px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:disabled { color: var(--line-2); cursor: not-allowed; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 2px; font-size: 14px; }
.context { color: var(--muted); font-size: 13.5px; padding-bottom: 14px; }
.context b { color: var(--ink); font-weight: 600; }

main { padding-block: 4px 48px; display: grid; gap: 20px; }
section.page { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel[hidden] { display: none; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.ph p { color: var(--muted); font-size: 13.5px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 90ch; }
.small { font-size: 12.5px; color: var(--faint); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.kpi { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; display: grid; gap: 2px; align-content: start; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.kpi .v { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--faint); }
.tip { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--faint); font-size: 10px; font-weight: 600; cursor: help; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
th.num { text-align: right; }
th[data-k] { cursor: pointer; user-select: none; } th[data-k]:hover { color: var(--ink); }
th.sorted::after { content: " ▾"; color: var(--accent); } th.sorted.asc::after { content: " ▴"; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child > td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover > td { background: var(--subtle); }
tr.open > td { background: var(--accent-soft); }
td.detail-cell { padding: 0; background: var(--subtle); }
.na { color: var(--faint); }
.flag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.botname { display: flex; align-items: center; gap: 9px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.strat { color: var(--muted); font-size: 13px; }
.caret { color: var(--faint); font-size: 12px; width: 14px; display: inline-block; }

/* status */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--up); background: var(--up-soft); }
.pill.attention, .pill.warning { color: var(--warn); background: var(--warn-soft); }
.pill.failing, .pill.serious { color: var(--down); background: var(--down-soft); }
.pill.unknown, .pill.info, .pill.past { color: var(--muted); background: var(--subtle); border: 1px solid var(--line); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 12px var(--sans); fill: var(--faint); }
.gl { stroke: var(--line); }
.zero { stroke: var(--line-2); }
.ttip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 4px 14px rgba(23, 33, 51, .08); border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: nowrap; z-index: 5; }
.ttip[hidden] { display: none; }
.ttip b { font-weight: 600; }
.ttip .row { display: flex; align-items: center; gap: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 99px; padding: 3px 11px; cursor: pointer; font-size: 13px; color: var(--ink); }
.legend button[aria-pressed="false"] { color: var(--faint); border-style: dashed; }
.legend button[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.empty { color: var(--muted); font-size: 14px; padding: 28px 8px; text-align: center; }

/* drill-down */
.drill { padding: 16px 20px 20px; display: grid; gap: 16px; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 10px; color: var(--muted); cursor: pointer; font-size: 14px; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.mini-kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.mini-kpis div { display: grid; }
.mini-kpis > div > span { font-size: 12.5px; color: var(--muted); }
.mini-kpis b { font-size: 17px; font-weight: 600; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.box { min-width: 0; }
.box > h3 { margin-bottom: 8px; font-size: 14px; }
.warns { display: grid; }
.warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.warn:first-child { border-top: 0; }
.health { display: grid; }
.hrow { display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1.4fr); gap: 6px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hrow:first-child { border-top: 0; }
details.method summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details.method dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 12px 0 0; font-size: 14px; }
details.method dt { font-weight: 600; }
details.method dd { margin: 0; color: var(--muted); }
.err { padding: 16px 18px; border: 1px solid var(--down); background: var(--down-soft); border-radius: var(--r); }
.closebtn { background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); }

@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
  .cols2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-left: 0; } .kpi:nth-child(4) { border-left: 1px solid var(--line); }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .meta { margin-left: 0; text-align: left; width: 100%; }
  .hrow { grid-template-columns: minmax(0, 1fr) auto; }
  .hrow > :last-child { grid-column: 1 / -1; }
  .panel { padding: 14px; }
}
</style>

  <div class="wrap bar">
    <div class="brand"><i aria-hidden="true"></i><h1>Trading Bot Analytics</h1></div>
    <nav class="tabs" role="tablist" aria-label="Pages">
      <button role="tab" data-tab="overview">Overview</button>
      <button role="tab" data-tab="stocks">Stock Analysis</button>
    </nav>
    <div class="meta" id="meta"></div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters">
    <div class="fld"><label for="f-bot">Bot</label><select id="f-bot"></select></div>
    <div class="fld"><label>Period</label><div class="seg" id="f-period" role="group" aria-label="Period">
      <button data-p="today">Today</button><button data-p="7">7 days</button><button data-p="30">30 days</button><button data-p="90">90 days</button><button data-p="all">All</button><button data-p="custom">Custom</button></div></div>
    <div class="fld" id="f-custom" hidden><input type="date" id="f-from" aria-label="From"><span class="faint">to</span><input type="date" id="f-to" aria-label="To"></div>
    <div class="fld"><label>Data</label><div class="seg" id="f-mode" role="group" aria-label="Data type"></div></div>
    <div class="fld stock-only"><label for="f-side">Direction</label><select id="f-side"><option value="">Long and short</option><option value="long">Long</option><option value="short">Short</option></select></div>
    <div class="fld stock-only"><input type="search" id="f-q" placeholder="Search ticker" aria-label="Search ticker"></div>
    <button class="linkbtn" id="f-reset" type="button">Reset filters</button>
  </div>
  <p class="context" id="context"></p>
</div>

<main class="wrap" id="app">
  <!-- ============================ OVERVIEW ============================ -->
  <section class="page" data-page="overview">
    <div class="kpis" id="ov-kpis"></div>
    <p class="note" id="ov-note" hidden></p>

    <div class="panel">
      <div class="ph"><div><h2>Performance</h2><p id="ch-sub"></p></div>
        <div class="seg" id="ch-view" role="group" aria-label="Chart view"><button data-v="cum" aria-pressed="true">Cumulative P&amp;L</button><button data-v="dd">Drawdown</button></div></div>
      <div class="legend" id="ch-legend" style="margin-bottom:10px"></div>
      <div class="chart" id="ch-main"></div>
    </div>

    <div class="panel">
      <div class="ph"><div><h2>Bot comparison</h2><p>Select a bot to see its detail. All figures use the filters above.</p></div></div>
      <div class="tw"><table id="bots"></table></div>
    </div>

    <div class="cols2">
      <div class="panel"><div class="ph"><div><h2>Recent trades</h2><p id="rc-sub"></p></div></div><div class="tw" id="recent"></div></div>
      <div class="panel"><div class="ph"><div><h2>Bot health</h2><p>Last successful run, data freshness and open warnings</p></div></div><div id="health"></div></div>
    </div>

    <div class="panel"><details class="method" id="method"><summary>How these numbers are calculated</summary><div id="method-body"></div></details></div>
  </section>

  <!-- ============================ STOCKS ============================ -->
  <section class="page" data-page="stocks" hidden>
    <div class="panel">
      <div class="ph"><div><h2 id="rk-title">Stocks</h2><p id="rk-def"></p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <select id="rk-view" aria-label="Ranking">
            <option value="traded">Most traded</option><option value="best">Best performers</option><option value="worst">Worst performers</option><option value="total">Highest total P&amp;L</option><option value="lowexp">Lowest expectancy</option></select>
          <div class="seg" id="rk-n" role="group" aria-label="How many"><button data-n="5">Top 5</button><button data-n="10" aria-pressed="true">Top 10</button></div>
          <div class="seg" id="rk-metric" role="group" aria-label="Chart metric"><button data-m="pnl" aria-pressed="true">P&amp;L</button><button data-m="n">Trades</button></div>
        </div></div>
      <div class="chart" id="rk-chart"></div>
      <p class="note" id="rk-conc" style="margin-top:10px"></p>
    </div>

    <div class="panel" id="stock-detail" hidden></div>

    <div class="panel">
      <div class="ph"><div><h2>All stocks</h2><p id="st-sub"></p></div></div>
      <div class="tw"><table id="stocks"></table></div>
    </div>
  </section>
</main>

function metrics(rets) {

    sd: null, ci_low: null, ci_high: null, best: null, worst: null };

  let cum = 0, peak = 0, mdd = 0;
  for (const x of r) { cum += x; peak = Math.max(peak, cum); mdd = Math.max(mdd, peak - cum); }

    avg_win: wins.length ? sum(wins) / wins.length : null, avg_loss: losses.length ? sum(losses) / losses.length : null,
    pf: gl > 0 ? sum(wins) / gl : null, max_dd: mdd, cur_dd: peak - cum, best: Math.max(...r), worst: Math.min(...r) });

  return out;
}

function groupStats(ts, keyFn, label, o = {}) {

  if (!g.size) return `<p class="empty">${o.empty || "Not recorded."}</p>`;
  let rows = [...g.entries()].map(([k, a]) => [k, metrics(a.map(t => t.ret))]);
  if (o.sort !== false) rows.sort((a, b) => (b[1].total ?? -1e9) - (a[1].total ?? -1e9));
  if (o.limit) rows = rows.slice(0, o.limit);

}
const entryBucket = t => { const s = t.entry_time || ""; if (!/^\d\d:\d\d$/.test(s)) return null; const m = +s.slice(0, 2) * 60 + +s.slice(3); return m < 575 ? "09:30–09:34" : m < 580 ? "09:35–09:39" : m < 585 ? "09:40–09:44" : m < 600 ? "09:45–09:59" : "10:00 or later"; };
function tradeTable(ts, o = {}) {

  $("#rk-def").textContent = `${R.def} ${D.modes[ST.mode]} data, ${periodText().toLowerCase()}. Select a bar to open the stock.`;
  const items = eligible.map(r => ST.rkMetric === "pnl" ? { label: r.s, v: r.m.total, text: `${pctPlain(r.m.total)} · ${r.m.n} trade${r.m.n === 1 ? "" : "s"}`, r } : { label: r.s, v: r.m.n, text: `${r.m.n} trade${r.m.n === 1 ? "" : "s"} · ${pctPlain(r.m.total)}`, r });
  hbar($("#rk-chart"), items, { neutral: ST.rkMetric === "n", aria: R.title, onClick: it => { ST.stock = it.r.s; renderStocks(); $("#stock-detail").scrollIntoView({ block: "nearest", behavior: "smooth" }); },
    empty: R.min && rows.length ? `No stock has ${R.min} or more trades in this selection, so this ranking would rest on one or two trades. Try a longer period or Backtest data.` : "No closed trades match these filters." });
  const gross = rows.reduce((a, r) => a + Math.abs(r.m.total || 0), 0), top3 = rows.slice().sort((a, b) => Math.abs(b.m.total) - Math.abs(a.m.total)).slice(0, 3);
  const share = gross ? top3.reduce((a, r) => a + Math.abs(r.m.total), 0) / gross * 100 : null;
  const losers = rows.filter(r => r.m.n >= MIN_RANK && r.m.total < 0 && r.m.wins / r.m.n < 0.5).map(r => r.s);
  $("#rk-conc").innerHTML = rows.length ? `${rows.length} stock${rows.length === 1 ? "" : "s"} traded. ${isNum(share) && rows.length > 3 ? `The 3 largest contributors (${top3.map(r => esc(r.s)).join(", ")}) make up ${share.toFixed(0)}% of absolute P&L. ` : ""}${losers.length ? `Losing on most trades (${MIN_RANK}+ trades): ${losers.map(esc).join(", ")}.` : `No stock with ${MIN_RANK}+ trades loses on most of them.`}` : "";
  const cols = [["s", "Ticker"], ["n", "Trades", 1], ["total", "P&L", 1], ["win_rate", "Win rate", 1], ["pf", "Profit factor", 1], ["avg", "Expectancy", 1], ["avg_win", "Avg win", 1], ["avg_loss", "Avg loss", 1], ["hold", "Avg held", 1], ["max_dd", "Max drawdown", 1], ["bots", "Bots"]];
  const key = r => ST.sort.k === "s" ? r.s : ST.sort.k === "hold" ? (r.hold ? (r.hold.hold_min ?? r.hold.hold_days * 390) : null) : ST.sort.k === "bots" ? r.bots.length : ST.sort.k === "n" ? r.m.n : r.m[ST.sort.k];
  const sorted = rows.slice().sort((a, b) => { const x = key(a), y = key(b); const c = x === y ? 0 : x === null || x === undefined ? 1 : y === null || y === undefined ? -1 : x < y ? -1 : 1; return ST.sort.asc ? c : -c; });
  $("#st-sub").textContent = `${rows.length} stock${rows.length === 1 ? "" : "s"} · select a column to sort, a row to open the stock`;
  $("#stocks").innerHTML = rows.length ? `<thead><tr>${cols.map(([k, l, n]) => `<th data-k="${k}" class="${n ? "num " : ""}${ST.sort.k === k ? "sorted" + (ST.sort.asc ? " asc" : "") : ""}">${l}</th>`).join("")}</tr></thead><tbody>${sorted.map(r => `<tr class="click ${ST.stock === r.s ? "open" : ""}" data-s="${esc(r.s)}" tabindex="0"><td><b>${esc(r.s)}</b></td><td class="num">${r.m.n}${sizeFlag(r.m.n)}</td><td class="num">${pct(r.m.total)}</td><td class="num">${r.m.n >= D.thresholds.tiny_n ? rate(r.m.win_rate) : `<span class="faint" title="Too few trades for a rate">${r.m.wins}/${r.m.n}</span>`}</td><td class="num">${ratio(r.m.pf)}</td><td class="num">${pct(r.m.avg, 3)}</td><td class="num">${pct(r.m.avg_win)}</td><td class="num">${pct(r.m.avg_loss)}</td><td class="num">${r.hold ? fhold(r.hold) : NA}</td><td class="num">${dd(r.m.max_dd)}</td><td>${r.bots.map(b => `<span class="dot" style="background:${color(b)};margin-right:3px" title="${esc(D.bots[b].name)}"></span>`).join("")}</td></tr>`).join("")}</tbody>` : `<tbody><tr><td class="empty">No closed trades match these filters.</td></tr></tbody>`;
  $("#stocks").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; ST.sort = { k, asc: ST.sort.k === k ? !ST.sort.asc : k === "s" }; renderStocks(); });
  $("#stocks").querySelectorAll("tr.click").forEach(tr => { const go = () => { ST.stock = ST.stock === tr.dataset.s ? null : tr.dataset.s; renderStocks(); if (ST.stock) $("#stock-detail").scrollIntoView({ block: "nearest", behavior: "smooth" }); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
  renderStockDetail(rows);
}
function renderStockDetail(rows) {
  const el = $("#stock-detail"), r = rows.find(x => x.s === ST.stock);
  if (!r) { el.hidden = true; return; }
  el.hidden = false;
  const m = r.m, ts = r.ts;
  const edges = [-2, -1, -0.5, 0, 0.5, 1, 2], bins = [];
  for (let i = 0; i <= edges.length; i++) { const lo = i ? edges[i - 1] : -Infinity, hi = i < edges.length ? edges[i] : Infinity; bins.push({ label: isFinite(lo) && isFinite(hi) ? `${lo} to ${hi}%` : isFinite(hi) ? `below ${hi}%` : `${lo}% or more`, v: ts.filter(t => t.ret >= lo && t.ret < hi).length }); }
  el.innerHTML = `<div class="ph"><div><h2>${esc(r.s)}</h2><p>${D.modes[ST.mode]} data · ${esc(periodText())} · ${r.bots.map(b => esc(D.bots[b].name)).join(", ")}</p></div><button class="closebtn" id="sd-close" type="button">Close</button></div>
    <div class="mini-kpis" style="margin-bottom:16px">${[["P&L", pct(m.total)], ["Trades", m.n + (m.n < D.thresholds.small_n ? " (small sample)" : "")], ["Won / lost", `${m.wins} / ${m.losses}`], ["Expectancy", pct(m.avg, 3)], ["Average win", pct(m.avg_win)], ["Average loss", pct(m.avg_loss)], ["Profit factor", ratio(m.pf)], ["Max drawdown", dd(m.max_dd)]].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>
    <div class="cols2"><div class="box"><h3>Cumulative P&amp;L</h3><div class="chart" id="sd-chart"></div></div>
      <div class="box"><h3>Result distribution</h3><div class="chart" id="sd-dist"></div></div>
      <div class="box"><h3>By bot</h3><div class="tw">${groupStats(ts, t => D.bots[t.bot].name, "Bot")}</div></div>
      <div class="box"><h3>Long against short</h3><div class="tw">${groupStats(ts, t => t.side, "Direction", { sort: false })}</div>
        <h3 style="margin:14px 0 8px;font-size:14px">Exit reason</h3><div class="tw">${groupStats(ts, t => t.reason || "not recorded", "Exit")}</div></div></div>
    <div class="box" style="margin-top:16px"><h3>Trade history</h3><div class="tw" style="max-height:360px;overflow:auto">${tradeTable(ts, { bot: true })}</div></div>`;
  $("#sd-close").onclick = () => { ST.stock = null; renderStocks(); };
  lineChart($("#sd-chart"), r.bots.map(b => ({ key: b, label: D.bots[b].name, color: color(b), pts: cumSeries(ts.filter(t => t.bot === b)) })), { h: 200, aria: r.s + " cumulative P&L" });
  hbar($("#sd-dist"), bins.map(b => ({ label: b.label, v: b.v, text: String(b.v) })), { neutral: true, labelW: 110, aria: "Distribution of trade results" });
}

// ------------------------------------------------------------ boot
function render() {
  syncControls();
  try { ST.tab === "overview" ? renderOverview() : renderStocks(); }
  catch (e) { console.error(e); const p = document.querySelector(`section.page[data-page="${ST.tab}"]`); p.insertAdjacentHTML("afterbegin", `<div class="err"><b>This page could not be drawn.</b> ${esc(e.message)}. Rebuild the data with <code>python -m src.dashboard</code>.</div>`); }
}
function boot() {
  if (!D || D.schema !== 1 || !D.bots) {
    $("#filters").hidden = true; $("#context").hidden = true;
    $("#app").innerHTML = `<div class="err"><b>No dashboard data.</b> This file is the template. Build the dashboard with <code>python -m src.dashboard</code> and open <code>reports/dashboard.html</code>.</div>`; return;
  }
  initFilters();
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });
  render();
}
boot();
</script>

</body></html>
