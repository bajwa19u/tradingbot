<title>Trading Bot Analytics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: a light corporate report. One header with two pages and a single
   filter bar; summaries first, detail opens in place on click. Navy ink, one
   restrained blue accent; green and red only on results. Light by design. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --subtle: #f9fafb; --line: #e4e7ec; --line-2: #cdd3db;
  --ink: #172133; --muted: #5a6575; --faint: #8b94a2;
  --accent: #2557c4; --accent-soft: #edf2fc;
  --up: #1d7a4e; --up-soft: #e6f3ec; --down: #b5373c; --down-soft: #fbeaea;
  --warn: #8f5d00; --warn-soft: #fbf2de;
  --s-daytrade: #2a78d6; --s-inplay: #e0662f; --s-swing: #6250d6; --s-all: #172133;
  --sans: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
h1 { font-size: 18px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
p { margin: 0; }
button, select, input { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .faint { color: var(--faint); }
.num { text-align: right; white-space: nowrap; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px 28px; flex-wrap: wrap; min-height: 58px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 5px; background: var(--ink); display: grid; place-items: center; }
.brand i::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: translateY(-1px) skewY(-25deg); }
nav.tabs { display: flex; gap: 4px; align-self: stretch; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 4px; margin: 0 8px; color: var(--muted); cursor: pointer; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.meta { margin-left: auto; color: var(--faint); font-size: 13px; text-align: right; }

/* filters */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 16px 6px; }
.fld { display: flex; align-items: center; gap: 8px; }
.fld[hidden] { display: none; }
.fld > label { font-size: 13px; color: var(--muted); }
select, input[type="date"], input[type="search"] { background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px; min-width: 0; max-width: 100%; }
input[type="search"] { width: 170px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-left: 1px solid var(--line); padding: 6px 11px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:disabled { color: var(--line-2); cursor: not-allowed; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 2px; font-size: 14px; }
.context { color: var(--muted); font-size: 13.5px; padding-bottom: 14px; }
.context b { color: var(--ink); font-weight: 600; }

main { padding-block: 4px 48px; display: grid; gap: 20px; }
section.page { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel[hidden] { display: none; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.ph p { color: var(--muted); font-size: 13.5px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 90ch; }
.small { font-size: 12.5px; color: var(--faint); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.kpi { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; display: grid; gap: 2px; align-content: start; }
.kpi:first-child { border-left: 0; }
.kpi .l { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.kpi .v { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--faint); }
.tip { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--faint); font-size: 10px; font-weight: 600; cursor: help; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
th.num { text-align: right; }
th[data-k] { cursor: pointer; user-select: none; } th[data-k]:hover { color: var(--ink); }
th.sorted::after { content: " ▾"; color: var(--accent); } th.sorted.asc::after { content: " ▴"; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child > td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover > td { background: var(--subtle); }
tr.open > td { background: var(--accent-soft); }
td.detail-cell { padding: 0; background: var(--subtle); }
.na { color: var(--faint); }
.flag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.botname { display: flex; align-items: center; gap: 9px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.strat { color: var(--muted); font-size: 13px; }
.caret { color: var(--faint); font-size: 12px; width: 14px; display: inline-block; }

/* status */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--up); background: var(--up-soft); }
.pill.attention, .pill.warning { color: var(--warn); background: var(--warn-soft); }
.pill.failing, .pill.serious { color: var(--down); background: var(--down-soft); }
.pill.unknown, .pill.info, .pill.past { color: var(--muted); background: var(--subtle); border: 1px solid var(--line); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 12px var(--sans); fill: var(--faint); }
.gl { stroke: var(--line); }
.zero { stroke: var(--line-2); }
.ttip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 4px 14px rgba(23, 33, 51, .08); border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: nowrap; z-index: 5; }
.ttip[hidden] { display: none; }
.ttip b { font-weight: 600; }
.ttip .row { display: flex; align-items: center; gap: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 99px; padding: 3px 11px; cursor: pointer; font-size: 13px; color: var(--ink); }
.legend button[aria-pressed="false"] { color: var(--faint); border-style: dashed; }
.legend button[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.empty { color: var(--muted); font-size: 14px; padding: 28px 8px; text-align: center; }

/* drill-down */
.drill { padding: 16px 20px 20px; display: grid; gap: 16px; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 10px; color: var(--muted); cursor: pointer; font-size: 14px; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.mini-kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.mini-kpis div { display: grid; }
.mini-kpis > div > span { font-size: 12.5px; color: var(--muted); }
.mini-kpis b { font-size: 17px; font-weight: 600; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.box { min-width: 0; }
.box > h3 { margin-bottom: 8px; font-size: 14px; }
.warns { display: grid; }
.warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.warn:first-child { border-top: 0; }
.health { display: grid; }
.hrow { display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1.4fr); gap: 6px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hrow:first-child { border-top: 0; }
details.method summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details.method dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 12px 0 0; font-size: 14px; }
details.method dt { font-weight: 600; }
details.method dd { margin: 0; color: var(--muted); }
.err { padding: 16px 18px; border: 1px solid var(--down); background: var(--down-soft); border-radius: var(--r); }
.closebtn { background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); }

@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
  .cols2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-left: 0; } .kpi:nth-child(4) { border-left: 1px solid var(--line); }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .meta { margin-left: 0; text-align: left; width: 100%; }
  .hrow { grid-template-columns: minmax(0, 1fr) auto; }
  .hrow > :last-child { grid-column: 1 / -1; }
  .panel { padding: 14px; }
}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><i aria-hidden="true"></i><h1>Trading Bot Analytics</h1></div>
    <nav class="tabs" role="tablist" aria-label="Pages">
      <button role="tab" data-tab="overview">Overview</button>
      <button role="tab" data-tab="stocks">Stock Analysis</button>
    </nav>
    <div class="meta" id="meta"></div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters">
    <div class="fld"><label for="f-bot">Bot</label><select id="f-bot"></select></div>
    <div class="fld"><label>Period</label><div class="seg" id="f-period" role="group" aria-label="Period">
      <button data-p="today">Today</button><button data-p="7">7 days</button><button data-p="30">30 days</button><button data-p="90">90 days</button><button data-p="all">All</button><button data-p="custom">Custom</button></div></div>
    <div class="fld" id="f-custom" hidden><input type="date" id="f-from" aria-label="From"><span class="faint">to</span><input type="date" id="f-to" aria-label="To"></div>
    <div class="fld"><label>Data</label><div class="seg" id="f-mode" role="group" aria-label="Data type"></div></div>
    <div class="fld stock-only"><label for="f-side">Direction</label><select id="f-side"><option value="">Long and short</option><option value="long">Long</option><option value="short">Short</option></select></div>
    <div class="fld stock-only"><input type="search" id="f-q" placeholder="Search ticker" aria-label="Search ticker"></div>
    <button class="linkbtn" id="f-reset" type="button">Reset filters</button>
  </div>
  <p class="context" id="context"></p>
</div>

<main class="wrap" id="app">
  <!-- ============================ OVERVIEW ============================ -->
  <section class="page" data-page="overview">
    <div class="kpis" id="ov-kpis"></div>
    <p class="note" id="ov-note" hidden></p>

    <div class="panel">
      <div class="ph"><div><h2>Performance</h2><p id="ch-sub"></p></div>
        <div class="seg" id="ch-view" role="group" aria-label="Chart view"><button data-v="cum" aria-pressed="true">Cumulative P&amp;L</button><button data-v="dd">Drawdown</button></div></div>
      <div class="legend" id="ch-legend" style="margin-bottom:10px"></div>
      <div class="chart" id="ch-main"></div>
    </div>

    <div class="panel">
      <div class="ph"><div><h2>Bot comparison</h2><p>Select a bot to see its detail. All figures use the filters above.</p></div></div>
      <div class="tw"><table id="bots"></table></div>
    </div>

    <div class="cols2">
      <div class="panel"><div class="ph"><div><h2>Recent trades</h2><p id="rc-sub"></p></div></div><div class="tw" id="recent"></div></div>
      <div class="panel"><div class="ph"><div><h2>Bot health</h2><p>Last successful run, data freshness and open warnings</p></div></div><div id="health"></div></div>
    </div>

    <div class="panel"><details class="method" id="method"><summary>How these numbers are calculated</summary><div id="method-body"></div></details></div>
  </section>

  <!-- ============================ STOCKS ============================ -->
  <section class="page" data-page="stocks" hidden>
    <div class="panel">
      <div class="ph"><div><h2 id="rk-title">Stocks</h2><p id="rk-def"></p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <select id="rk-view" aria-label="Ranking">
            <option value="traded">Most traded</option><option value="best">Best performers</option><option value="worst">Worst performers</option><option value="total">Highest total P&amp;L</option><option value="lowexp">Lowest expectancy</option></select>
          <div class="seg" id="rk-n" role="group" aria-label="How many"><button data-n="5">Top 5</button><button data-n="10" aria-pressed="true">Top 10</button></div>
          <div class="seg" id="rk-metric" role="group" aria-label="Chart metric"><button data-m="pnl" aria-pressed="true">P&amp;L</button><button data-m="n">Trades</button></div>
        </div></div>
      <div class="chart" id="rk-chart"></div>
      <p class="note" id="rk-conc" style="margin-top:10px"></p>
    </div>

    <div class="panel" id="stock-detail" hidden></div>

    <div class="panel">
      <div class="ph"><div><h2>All stocks</h2><p id="st-sub"></p></div></div>
      <div class="tw"><table id="stocks"></table></div>
    </div>
  </section>
</main>

<script>
const D = /*__DASHBOARD_DATA__*/null;

// ------------------------------------------------------------ the one metric (port of src/dashboard.py metrics)
function metrics(rets) {
  const r = [];
  for (const v of rets) { const x = (v === null || v === undefined || typeof v === "boolean") ? NaN : Number(v); if (Number.isFinite(x)) r.push(x); }
  const n = r.length, wins = r.filter(x => x > 0), losses = r.filter(x => x < 0);
  const out = { n, wins: wins.length, losses: losses.length, flat: n - wins.length - losses.length,
    win_rate: null, total: null, avg: null, avg_win: null, avg_loss: null, pf: null, max_dd: null, cur_dd: null,
    sd: null, ci_low: null, ci_high: null, best: null, worst: null };
  if (!n) return out;
  let cum = 0, peak = 0, mdd = 0;
  for (const x of r) { cum += x; peak = Math.max(peak, cum); mdd = Math.max(mdd, peak - cum); }
  const sum = a => a.reduce((s, x) => s + x, 0), gl = -sum(losses);
  Object.assign(out, { win_rate: 100 * wins.length / n, total: cum, avg: cum / n,
    avg_win: wins.length ? sum(wins) / wins.length : null, avg_loss: losses.length ? sum(losses) / losses.length : null,
    pf: gl > 0 ? sum(wins) / gl : null, max_dd: mdd, cur_dd: peak - cum, best: Math.max(...r), worst: Math.min(...r) });
  if (n > 1) {
    const mean = cum / n, sd = Math.sqrt(r.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1)), half = 1.96 * sd / Math.sqrt(n);
    Object.assign(out, { sd, ci_low: mean - half, ci_high: mean + half });
  }
  for (const k in out) if (typeof out[k] === "number" && !["n", "wins", "losses", "flat"].includes(k)) out[k] = Math.round(out[k] * 1e4) / 1e4;
  return out;
}
function verdictOf(m) {
  if (!m.n) return "none";
  if (m.total !== null && m.total <= 0) return "neg";
  if (m.n < D.thresholds.small_n) return "few";
  return m.ci_low !== null && m.ci_low > 0 ? "pos" : "noise";
}
window.__dash = { metrics, verdictOf };

// ------------------------------------------------------------ formatting
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && Number.isFinite(v);
const NA = '<span class="na">—</span>';
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function signed(v, d = 2) { return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d); }
function pct(v, d = 2) { return isNum(v) ? `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${signed(v, d)}%</span>` : NA; }
function pctPlain(v, d = 2) { return isNum(v) ? signed(v, d) + "%" : "—"; }
function rate(v) { return isNum(v) ? v.toFixed(0) + "%" : NA; }
function ratio(v) { return isNum(v) ? v.toFixed(2) : NA; }
function dd(v) { return isNum(v) ? (v > 0 ? `<span class="down">−${v.toFixed(2)}%</span>` : "0.00%") : NA; }
function price(v) { return isNum(v) ? v.toFixed(2) : NA; }
function fdate(s, year = true) { if (!s || !/^\d{4}-\d\d-\d\d/.test(s)) return s || "—"; const [y, m, d] = s.slice(0, 10).split("-"); return `${+d} ${MON[+m - 1]}${year ? " " + y : ""}`; }
function fUtcEt(iso) {
  if (!iso) return null;
  const t = new Date(iso); if (isNaN(t)) return null;
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "America/New_York", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(t);
  const g = k => (p.find(x => x.type === k) || {}).value;
  return `${g("day")} ${g("month")}, ${g("hour")}:${g("minute")} ET`;
}
function fhold(t) { return isNum(t.hold_min) ? (t.hold_min >= 60 ? `${Math.floor(t.hold_min / 60)}h ${String(Math.round(t.hold_min % 60)).padStart(2, "0")}m` : `${Math.round(t.hold_min)}m`) : isNum(t.hold_days) ? `${t.hold_days} day${t.hold_days === 1 ? "" : "s"}` : NA; }
function sizeFlag(n) { return n < D.thresholds.tiny_n ? `<span class="flag" title="Fewer than ${D.thresholds.tiny_n} trades: not enough to compare">small</span>` : n < D.thresholds.small_n ? `<span class="flag" title="Fewer than ${D.thresholds.small_n} trades: treat with caution">small</span>` : ""; }
const tip = t => `<span class="tip" title="${esc(t)}" aria-label="${esc(t)}">?</span>`;
const BOT_KEYS = ["daytrade", "inplay", "swing"];
const color = k => `var(--s-${k})`;
const UNIT = "% of account, 1% risked per trade";
const STATE_LBL = { ok: "Running", attention: "Needs attention", failing: "Failing", unknown: "Unknown" };

// ------------------------------------------------------------ state & filters
const DEFAULTS = { bot: "all", period: "30", from: "", to: "", mode: "live", side: "", q: "" };
const ST = Object.assign({ tab: "overview", openBot: null, botTab: "perf", chartView: "cum", hidden: new Set(),
  stock: null, rkView: "traded", rkN: 10, rkMetric: "pnl", sort: { k: "n", asc: false } }, DEFAULTS);
try { const s = JSON.parse(localStorage.getItem("tba-view") || "{}"); if (s.tab === "stocks") ST.tab = "stocks"; } catch (e) {}

function addDays(iso, n) { const t = new Date(iso + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function periodRange() {
  const a = D.as_of;
  if (ST.period === "today") return [a, a];
  if (ST.period === "all") return ["", ""];
  if (ST.period === "custom") return [ST.from, ST.to];
  return [addDays(a, -(+ST.period - 1)), a];
}
function periodText() {
  const [f, t] = periodRange();
  const lbl = { today: "Today", 7: "Last 7 days", 30: "Last 30 days", 90: "Last 90 days", all: "All history", custom: "Custom range" }[ST.period];
  if (!f && !t) return lbl;
  return `${lbl} (${f ? fdate(f, f.slice(0, 4) !== (t || f).slice(0, 4)) : "start"} – ${t ? fdate(t) : "latest"})`;
}
const botsSel = () => ST.bot === "all" ? BOT_KEYS : [ST.bot];

// ------------------------------------------------------------ charts
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = []; for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
/** Lines over trading sessions. series: [{key,label,color,pts:{date: {y, day, n}}}] */
function lineChart(el, series, o = {}) {
  el.innerHTML = "";

  if (!dates.length || !series.length) { el.innerHTML = `<p class="empty">${o.empty || "No closed trades match these filters."}</p>`; return; }
  const ys = series.flatMap(s => Object.values(s.pts).map(p => p.y)).concat([0]);
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const W = Math.max(300, Math.round(el.clientWidth || 700)), H = o.h || 280, L = 52, R = 14, T = 12, B = 30;
  const n = dates.length, X = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - ticks[0]) / (ticks[ticks.length - 1] - ticks[0] || 1));
  let g = ticks.map(t => `<line class="${t === 0 ? "zero" : "gl"}" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" : t < 0 ? "−" : ""}${Math.abs(t)}%</text>`).join("");
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L) / 90))));
  dates.forEach((d, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${n === 1 ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${fdate(d, false)}</text>`; });
  let lines = "";
  for (const s of series) {
    let path = "", started = false, lastI = -1;
    dates.forEach((d, i) => { const p = s.pts[d]; if (!p) return; path += `${started ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`; started = true; lastI = i; });
    if (!started) continue;
    lines += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.key === "all" ? 2.5 : 2}" stroke-linejoin="round"/>`;
    const lp = s.pts[dates[lastI]];
    lines += `<circle cx="${X(lastI)}" cy="${Y(lp.y)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Performance chart")}">${g}<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--line-2)" style="opacity:0"/>${lines}</svg>`;
  const tt = document.createElement("div"); tt.className = "ttip"; tt.hidden = true; el.appendChild(tt);
  const svg = el.querySelector("svg"), cross = svg.querySelector(".cross");
  svg.addEventListener("mousemove", e => {
    const rc = svg.getBoundingClientRect(), sx = (e.clientX - rc.left) * W / rc.width;
    let i = n === 1 ? 0 : Math.round((sx - L) / ((W - L - R) / (n - 1))); i = Math.max(0, Math.min(n - 1, i));
    const d = dates[i];
    tt.innerHTML = `<b>${fdate(d)}</b>` + series.map(s => { const p = s.pts[d]; return p ? `<div class="row"><span class="dot" style="background:${s.color}"></span>${esc(s.label)}: ${pctPlain(p.y)}${isNum(p.day) ? ` <span class="faint">(day ${pctPlain(p.day)}, ${p.n} trade${p.n === 1 ? "" : "s"})</span>` : ""}</div>` : ""; }).join("");
    tt.hidden = false;
    const x = X(i) * rc.width / W; tt.style.left = Math.min(Math.max(0, x - 120), Math.max(0, rc.width - 280)) + "px"; tt.style.top = "8px";
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.style.opacity = 1;

/** Horizontal bars, one per label; click calls o.onClick(item). */
function hbar(el, items, o = {}) {

  if (!items.length) { el.innerHTML = `<p class="empty">${o.empty || "Nothing matches these filters."}</p>`; return; }
  const W = Math.max(300, Math.round(el.clientWidth || 700)), rowH = 26, L = o.labelW || 70, R = 120, H = items.length * rowH + 8;

/** Cumulative (or drawdown) series by session for a list of trades. */
function cumSeries(ts, view = "cum") {

  const pts = {}; let cum = 0, peak = 0;
  [...byDay.keys()].sort().forEach(d => { const r = byDay.get(d); cum += r.s; peak = Math.max(peak, cum); pts[d] = { y: +(view === "dd" ? cum - peak : cum).toFixed(4), day: +r.s.toFixed(4), n: r.n }; });
  return pts;
}

    ["Win rate", rate(m.win_rate), m.n ? `${m.wins} won · ${m.losses} lost${m.flat ? " · " + m.flat + " flat" : ""}` : "no closed trades", "Winning trades divided by closed trades. Read it with average win and loss."],
    ["Profit factor", ratio(m.pf), m.n && m.pf === null ? "no losing trade" : "gross wins ÷ gross losses", "Above 1.00 makes money; below 1.00 loses."],
    ["Expectancy", pct(m.avg, 3), "average per trade" + (isNum(m.ci_low) ? ` · 95% CI ${pctPlain(m.ci_low)} to ${pctPlain(m.ci_high)}` : ""), "Average result per closed trade. If its 95% interval spans zero, the result is indistinguishable from luck."],

function groupStats(ts, keyFn, label, o = {}) {
  const g = new Map(); ts.forEach(t => { const k = keyFn(t); if (k === null || k === undefined) return; if (!g.has(k)) g.set(k, []); g.get(k).push(t); });
  if (!g.size) return `<p class="empty">${o.empty || "Not recorded."}</p>`;
  let rows = [...g.entries()].map(([k, a]) => [k, metrics(a.map(t => t.ret))]);
  if (o.sort !== false) rows.sort((a, b) => (b[1].total ?? -1e9) - (a[1].total ?? -1e9));
  if (o.limit) rows = rows.slice(0, o.limit);
  return `<table><thead><tr><th>${esc(label)}</th><th class="num">Trades</th><th class="num">P&amp;L</th><th class="num">Win rate</th><th class="num">Expectancy</th></tr></thead><tbody>${rows.map(([k, m]) => `<tr><td>${esc(k)}</td><td class="num">${m.n}${sizeFlag(m.n)}</td><td class="num">${pct(m.total)}</td><td class="num">${m.n >= D.thresholds.tiny_n ? rate(m.win_rate) : `<span class="faint">${m.wins}/${m.n}</span>`}</td><td class="num">${pct(m.avg, 3)}</td></tr>`).join("")}</tbody></table>`;
}
const entryBucket = t => { const s = t.entry_time || ""; if (!/^\d\d:\d\d$/.test(s)) return null; const m = +s.slice(0, 2) * 60 + +s.slice(3); return m < 575 ? "09:30–09:34" : m < 580 ? "09:35–09:39" : m < 585 ? "09:40–09:44" : m < 600 ? "09:45–09:59" : "10:00 or later"; };
function tradeTable(ts, o = {}) {

}

  el.innerHTML = `<div class="subtabs" role="tablist">${tabs.map(([id, l]) => `<button role="tab" data-t="${id}" aria-selected="${ST.botTab === id}">${l}</button>`).join("")}</div>${body}`;
  el.querySelectorAll(".subtabs button").forEach(x => x.onclick = e => { e.stopPropagation(); ST.botTab = x.dataset.t; renderDrill(k); });
  el.querySelectorAll("[data-go=stocks]").forEach(x => x.onclick = () => { ST.bot = k; ST.tab = "stocks"; render(); window.scrollTo(0, 0); });
  if (ST.botTab === "perf") lineChart($("#drill-chart"), [{ key: k, label: b.name, color: color(k), pts: cumSeries(ts) }], { h: 200, aria: b.name + " cumulative P&L" });
}
function rejected() {
  const [f, t] = periodRange();
  const picks = (D.setups.picks || []).filter(p => (!f || p.date >= f) && (!t || p.date <= t));
  if (!picks.length) return "";
  const c = {}; picks.forEach(p => c[p.outcome] = (c[p.outcome] || 0) + 1);
  const alt = picks.filter(p => p.outcome !== "traded" && p.alt_rule);
  const am = metrics(alt.map(p => p.alt_ret));
  return `<div class="box"><h3>Entry filter: what the rule looked at (backtest month)</h3><p class="note">${picks.length} stock-days evaluated: ${Object.entries(c).map(([k2, v]) => `${v} ${esc(k2)}`).join(", ")}. ` +
    (alt.length ? `With the blocking filter off (same entry, stop, exit and costs), the blocked picks would have made ${pctPlain(am.total)} over ${am.n} trades.` : `What the blocked picks would have done is recorded from the next backtest run. The 12-month study found that removing the range filter more than doubles trades and loses on both date ranges (reports/orb_bigtech.md).`) + `</p></div>`;
}
function compareModes(k) {
  const b = D.bots[k], modes = Object.keys(b.modes);
  if (modes.length < 2) return `<p class="note">${esc(b.name)} keeps only a ${modes.map(x => D.modes[x].toLowerCase()).join(" ")} record in this repo, so there is no backtest of the current settings to compare against.</p>`;
  const [f, t] = periodRange();
  const by = md => D.trades.filter(x => x.bot === k && x.mode === md && x.status === "closed" && (!f || x.date >= f) && (!t || x.date <= t));
  const live = by("live"), bt = by("backtest"), liveDays = new Set(live.map(x => x.date));
  const btSame = bt.filter(x => liveDays.has(x.date));
  const row = (lbl, ts2, note) => { const m = metrics(ts2.map(x => x.ret)); return `<tr><td>${lbl}<div class="small">${note}</div></td><td class="num">${m.n}${sizeFlag(m.n)}</td><td class="num">${pct(m.total)}</td><td class="num">${rate(m.win_rate)}</td><td class="num">${ratio(m.pf)}</td><td class="num">${pct(m.avg, 3)}</td></tr>`; };
  const ints = k === "daytrade" ? D.integrity.filter(c => c.check === "live posts match the month replay") : [];
  return `<div class="tw"><table><thead><tr><th>Record</th><th class="num">Trades</th><th class="num">P&amp;L</th><th class="num">Win rate</th><th class="num">Profit factor</th><th class="num">Expectancy</th></tr></thead><tbody>
    ${row("Live", live, "trades posted to Discord")}${row("Backtest, same sessions as live", btSame, "the like-for-like pair")}${row("Backtest, all sessions in period", bt, esc(b.modes.backtest))}</tbody></table></div>
    <p class="note">Only the same-session pair compares like with like; different sessions compare markets as well as rules.${ints.length ? ` Trade-by-trade check: ${esc(ints[0].detail)}.` : ""}</p>`;
}
function quality(k) {
  const b = D.bots[k], w = b.warnings || [];
  const books = { daytrade: ["daytrade", "month_replay"], inplay: ["inplay"], swing: ["swing_paper"] }[k];
  const ints = D.integrity.filter(c => books.includes(c.book));
  const a = b.announce;
  return `<div class="cols2"><div class="box"><h3>Warnings</h3><div class="warns">${w.length ? w.map(i => `<div class="warn"><span class="pill ${i.level}">${i.level === "serious" ? "Action" : "Watch"}</span><span>${esc(i.text)}</span></div>`).join("") : '<p class="note">No open warnings for this bot.</p>'}</div>
    ${a ? `<p class="note" style="margin-top:10px">Last announce record (${fdate(a.date)}): ${a.entries} entr${a.entries === 1 ? "y" : "ies"}, ${a.with_message_id} accepted by Discord, ${a.exits} result${a.exits === 1 ? "" : "s"}, daily summary ${a.summary ? "posted" : "not posted"}.</p>` : ""}
    ${k === "daytrade" && D.excluded.daytrade_replay ? `<p class="note" style="margin-top:10px">${D.excluded.daytrade_replay} backfilled ledger rows are left out of the live figures; the backtest covers those sessions.</p>` : ""}
    ${k === "inplay" ? `<p class="note" style="margin-top:10px">The ORB candidate paper record also runs inside this job but trades a different rule (top 10, stop to entry at +1x). It is research, not this bot, so it is not counted here.</p>` : ""}</div>
    <div class="box"><h3>Record checks</h3><table><tbody>${ints.map(c => `<tr><td><span class="pill ${c.ok ? "ok" : "failing"}">${c.ok ? "Pass" : "Fail"}</span></td><td>${esc(c.check)}<div class="small">${esc(c.detail)}</div></td></tr>`).join("")}</tbody></table>
    <p class="small" style="margin-top:8px">Workflows: ${b.workflows.map(esc).join(", ")}</p></div></div>`;
}

// ------------------------------------------------------------ recent, health, method
function renderRecent() {
  const ts = select().slice(-8).reverse();
  $("#rc-sub").textContent = `Latest closed ${D.modes[ST.mode].toLowerCase()} trades in the selection`;
  $("#recent").innerHTML = ts.length ? `<table><tbody>${ts.map(t => `<tr><td style="width:18px"><span class="dot" style="background:${color(t.bot)}" title="${esc(D.bots[t.bot].name)}"></span></td><td><b>${esc(t.symbol)}</b> <span class="faint">${esc(t.side || "")}</span><div class="small">${fdate(t.date)}${t.entry_time && /^\d\d:\d\d$/.test(t.entry_time) ? " · " + esc(t.entry_time) + "–" + esc(t.exit_time || "") : ""} · ${esc(t.reason || "")}</div></td><td class="num">${pct(t.ret)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No closed trades in this selection.</p>`;
}
function freshText(v) { if (!v) return "not recorded"; return v.length > 10 ? fdate(v) + v.slice(10) + " ET" : fdate(v); }
function renderHealth() {
  const rows = BOT_KEYS.map(k => { const b = D.bots[k];
    return `<div class="hrow"><div class="botname"><span class="dot" style="background:${color(k)}"></span><div><b>${esc(b.name)}</b><div class="small">${esc(b.freshness.label)}: ${esc(freshText(b.freshness.value))}</div></div></div><span class="pill ${b.state}">${STATE_LBL[b.state]}</span><div class="small">${fUtcEt(b.last_success) ? "Last successful run " + fUtcEt(b.last_success) : "No run history"}${b.failures.length ? ` · <span class="down">${b.failures.length} failed run${b.failures.length > 1 ? "s" : ""} this week</span>` : ""}</div></div>`; }).join("");
  const ws = (D.health.issues || []).filter(i => i.level === "serious" || i.level === "warning");
  $("#health").innerHTML = `<div class="health">${rows}</div>` + (ws.length ? `<h3 style="margin:14px 0 4px;font-size:14px">Warnings</h3><div class="warns">${ws.map(i => `<div class="warn"><span class="pill ${i.level}">${i.level === "serious" ? "Action" : "Watch"}</span><span>${esc(i.text)}${i.bot ? ` <span class="faint">· ${esc(D.bots[i.bot].name)}</span>` : ""}</span></div>`).join("")}</div>` : `<p class="note" style="margin-top:12px">No open warnings.</p>`) +
    (D.health.actions ? "" : `<p class="small" style="margin-top:10px">Run history could not be read when this page was built (${esc(D.health.actions_source)}), so run status shows as unknown.</p>`);
}
function renderMethod() {
  const items = [
    ["Unit", "Every bot records each trade as a share of the account with 1% of the account at risk, so results compare across bots. Dollar P&L is not shown: the two Discord bots record no account size. The swing bot's paper account is $2,000 (1% = $20)."],
    ["Data types", "Live = trades the bots posted to Discord. Paper = the swing bot's forward test. Backtest = rules replayed on past bars. They are never added together."],
    ["All bots", "The selected bots' trades go into one time-ordered list and the same metrics are computed on it. The chart's combined line adds daily results. Each trade belongs to one bot, so nothing is counted twice; day-trade backfill rows are left out because the backtest covers those sessions."],
    ["Periods", `Calendar days ending ${fdate(D.as_of)}, the latest session closed when the page was built. Today = that session only.`],
    ["Costs", "Results are net of each bot's modelled slippage (0.05% a side intraday, 0.03% swing). They are not broker fills."],
    ["Definitions", "A win is a result above zero. Expectancy is the average result per closed trade. Profit factor is gross wins divided by gross losses. Max drawdown is the largest fall of cumulative P&L from its running high."],
    ["Small samples", `Groups under ${D.thresholds.small_n} trades are flagged "small"; groups under ${D.thresholds.tiny_n} show wins out of trades instead of a win rate. Rankings never use win rate alone.`],
    ["Record checks", `${D.integrity.filter(c => c.ok).length} of ${D.integrity.length} passed when the page was built: unique trade ids, trades = wins + losses + flat, open positions kept out, live posts match the backtest on shared sessions, swing totals match src/paper.py.`],
  ];
  $("#method-body").innerHTML = `<dl>${items.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`;
}

// ------------------------------------------------------------ stock analysis
const MIN_RANK = 3;
const RANKS = {
  traded: { title: "Most traded stocks", def: "Ranked by number of closed trades.", sort: (a, b) => b.m.n - a.m.n || (b.m.total - a.m.total) },
  best: { title: "Best performers", def: `Ranked by expectancy (average result per trade), stocks with at least ${MIN_RANK} trades.`, min: MIN_RANK, sort: (a, b) => b.m.avg - a.m.avg },
  worst: { title: "Worst performers", def: "Ranked by total P&L, lowest first.", sort: (a, b) => a.m.total - b.m.total },
  total: { title: "Highest total P&L", def: "Ranked by total P&L, highest first.", sort: (a, b) => b.m.total - a.m.total },
  lowexp: { title: "Lowest expectancy", def: `Ranked by expectancy, lowest first, stocks with at least ${MIN_RANK} trades.`, min: MIN_RANK, sort: (a, b) => a.m.avg - b.m.avg },
};
function stockRows() {
  const g = new Map(); select(botsSel(), { stockFilters: true }).forEach(t => { if (!g.has(t.symbol)) g.set(t.symbol, []); g.get(t.symbol).push(t); });
  return [...g.entries()].map(([s, ts]) => {
    const mins = ts.map(t => t.hold_min).filter(isNum), days = ts.map(t => t.hold_days).filter(isNum);
    return { s, ts, m: metrics(ts.map(t => t.ret)), bots: [...new Set(ts.map(t => t.bot))],
      hold: mins.length === ts.length ? { hold_min: mins.reduce((a, b) => a + b, 0) / mins.length } : days.length === ts.length ? { hold_days: +(days.reduce((a, b) => a + b, 0) / days.length).toFixed(1) } : null };
  });
}
function renderStocks() {
  const rows = stockRows(), R = RANKS[ST.rkView];
  document.querySelectorAll("#rk-n button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === ST.rkN)));
  document.querySelectorAll("#rk-metric button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === ST.rkMetric)));
  $("#rk-view").value = ST.rkView;
  const eligible = rows.filter(r => !R.min || r.m.n >= R.min).sort(R.sort).slice(0, ST.rkN);
  $("#rk-title").textContent = `${R.title} · top ${ST.rkN}`;
  $("#rk-def").textContent = `${R.def} ${D.modes[ST.mode]} data, ${periodText().toLowerCase()}. Select a bar to open the stock.`;
  const items = eligible.map(r => ST.rkMetric === "pnl" ? { label: r.s, v: r.m.total, text: `${pctPlain(r.m.total)} · ${r.m.n} trade${r.m.n === 1 ? "" : "s"}`, r } : { label: r.s, v: r.m.n, text: `${r.m.n} trade${r.m.n === 1 ? "" : "s"} · ${pctPlain(r.m.total)}`, r });
  hbar($("#rk-chart"), items, { neutral: ST.rkMetric === "n", aria: R.title, onClick: it => { ST.stock = it.r.s; renderStocks(); $("#stock-detail").scrollIntoView({ block: "nearest", behavior: "smooth" }); },
    empty: R.min && rows.length ? `No stock has ${R.min} or more trades in this selection, so this ranking would rest on one or two trades. Try a longer period or Backtest data.` : "No closed trades match these filters." });
  const gross = rows.reduce((a, r) => a + Math.abs(r.m.total || 0), 0), top3 = rows.slice().sort((a, b) => Math.abs(b.m.total) - Math.abs(a.m.total)).slice(0, 3);
  const share = gross ? top3.reduce((a, r) => a + Math.abs(r.m.total), 0) / gross * 100 : null;
  const losers = rows.filter(r => r.m.n >= MIN_RANK && r.m.total < 0 && r.m.wins / r.m.n < 0.5).map(r => r.s);
  $("#rk-conc").innerHTML = rows.length ? `${rows.length} stock${rows.length === 1 ? "" : "s"} traded. ${isNum(share) && rows.length > 3 ? `The 3 largest contributors (${top3.map(r => esc(r.s)).join(", ")}) make up ${share.toFixed(0)}% of absolute P&L. ` : ""}${losers.length ? `Losing on most trades (${MIN_RANK}+ trades): ${losers.map(esc).join(", ")}.` : `No stock with ${MIN_RANK}+ trades loses on most of them.`}` : "";
  const cols = [["s", "Ticker"], ["n", "Trades", 1], ["total", "P&L", 1], ["win_rate", "Win rate", 1], ["pf", "Profit factor", 1], ["avg", "Expectancy", 1], ["avg_win", "Avg win", 1], ["avg_loss", "Avg loss", 1], ["hold", "Avg held", 1], ["max_dd", "Max drawdown", 1], ["bots", "Bots"]];
  const key = r => ST.sort.k === "s" ? r.s : ST.sort.k === "hold" ? (r.hold ? (r.hold.hold_min ?? r.hold.hold_days * 390) : null) : ST.sort.k === "bots" ? r.bots.length : ST.sort.k === "n" ? r.m.n : r.m[ST.sort.k];
  const sorted = rows.slice().sort((a, b) => { const x = key(a), y = key(b); const c = x === y ? 0 : x === null || x === undefined ? 1 : y === null || y === undefined ? -1 : x < y ? -1 : 1; return ST.sort.asc ? c : -c; });
  $("#st-sub").textContent = `${rows.length} stock${rows.length === 1 ? "" : "s"} · select a column to sort, a row to open the stock`;
  $("#stocks").innerHTML = rows.length ? `<thead><tr>${cols.map(([k, l, n]) => `<th data-k="${k}" class="${n ? "num " : ""}${ST.sort.k === k ? "sorted" + (ST.sort.asc ? " asc" : "") : ""}">${l}</th>`).join("")}</tr></thead><tbody>${sorted.map(r => `<tr class="click ${ST.stock === r.s ? "open" : ""}" data-s="${esc(r.s)}" tabindex="0"><td><b>${esc(r.s)}</b></td><td class="num">${r.m.n}${sizeFlag(r.m.n)}</td><td class="num">${pct(r.m.total)}</td><td class="num">${r.m.n >= D.thresholds.tiny_n ? rate(r.m.win_rate) : `<span class="faint" title="Too few trades for a rate">${r.m.wins}/${r.m.n}</span>`}</td><td class="num">${ratio(r.m.pf)}</td><td class="num">${pct(r.m.avg, 3)}</td><td class="num">${pct(r.m.avg_win)}</td><td class="num">${pct(r.m.avg_loss)}</td><td class="num">${r.hold ? fhold(r.hold) : NA}</td><td class="num">${dd(r.m.max_dd)}</td><td>${r.bots.map(b => `<span class="dot" style="background:${color(b)};margin-right:3px" title="${esc(D.bots[b].name)}"></span>`).join("")}</td></tr>`).join("")}</tbody>` : `<tbody><tr><td class="empty">No closed trades match these filters.</td></tr></tbody>`;
  $("#stocks").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; ST.sort = { k, asc: ST.sort.k === k ? !ST.sort.asc : k === "s" }; renderStocks(); });
  $("#stocks").querySelectorAll("tr.click").forEach(tr => { const go = () => { ST.stock = ST.stock === tr.dataset.s ? null : tr.dataset.s; renderStocks(); if (ST.stock) $("#stock-detail").scrollIntoView({ block: "nearest", behavior: "smooth" }); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
  renderStockDetail(rows);
}
function renderStockDetail(rows) {
  const el = $("#stock-detail"), r = rows.find(x => x.s === ST.stock);
  if (!r) { el.hidden = true; return; }
  el.hidden = false;
  const m = r.m, ts = r.ts;
  const edges = [-2, -1, -0.5, 0, 0.5, 1, 2], bins = [];
  for (let i = 0; i <= edges.length; i++) { const lo = i ? edges[i - 1] : -Infinity, hi = i < edges.length ? edges[i] : Infinity; bins.push({ label: isFinite(lo) && isFinite(hi) ? `${lo} to ${hi}%` : isFinite(hi) ? `below ${hi}%` : `${lo}% or more`, v: ts.filter(t => t.ret >= lo && t.ret < hi).length }); }
  el.innerHTML = `<div class="ph"><div><h2>${esc(r.s)}</h2><p>${D.modes[ST.mode]} data · ${esc(periodText())} · ${r.bots.map(b => esc(D.bots[b].name)).join(", ")}</p></div><button class="closebtn" id="sd-close" type="button">Close</button></div>
    <div class="mini-kpis" style="margin-bottom:16px">${[["P&L", pct(m.total)], ["Trades", m.n + (m.n < D.thresholds.small_n ? " (small sample)" : "")], ["Won / lost", `${m.wins} / ${m.losses}`], ["Expectancy", pct(m.avg, 3)], ["Average win", pct(m.avg_win)], ["Average loss", pct(m.avg_loss)], ["Profit factor", ratio(m.pf)], ["Max drawdown", dd(m.max_dd)]].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>
    <div class="cols2"><div class="box"><h3>Cumulative P&amp;L</h3><div class="chart" id="sd-chart"></div></div>
      <div class="box"><h3>Result distribution</h3><div class="chart" id="sd-dist"></div></div>
      <div class="box"><h3>By bot</h3><div class="tw">${groupStats(ts, t => D.bots[t.bot].name, "Bot")}</div></div>
      <div class="box"><h3>Long against short</h3><div class="tw">${groupStats(ts, t => t.side, "Direction", { sort: false })}</div>
        <h3 style="margin:14px 0 8px;font-size:14px">Exit reason</h3><div class="tw">${groupStats(ts, t => t.reason || "not recorded", "Exit")}</div></div></div>
    <div class="box" style="margin-top:16px"><h3>Trade history</h3><div class="tw" style="max-height:360px;overflow:auto">${tradeTable(ts, { bot: true })}</div></div>`;
  $("#sd-close").onclick = () => { ST.stock = null; renderStocks(); };
  lineChart($("#sd-chart"), r.bots.map(b => ({ key: b, label: D.bots[b].name, color: color(b), pts: cumSeries(ts.filter(t => t.bot === b)) })), { h: 200, aria: r.s + " cumulative P&L" });
  hbar($("#sd-dist"), bins.map(b => ({ label: b.label, v: b.v, text: String(b.v) })), { neutral: true, labelW: 110, aria: "Distribution of trade results" });
}

// ------------------------------------------------------------ boot
function render() {
  syncControls();
  try { ST.tab === "overview" ? renderOverview() : renderStocks(); }
  catch (e) { console.error(e); const p = document.querySelector(`section.page[data-page="${ST.tab}"]`); p.insertAdjacentHTML("afterbegin", `<div class="err"><b>This page could not be drawn.</b> ${esc(e.message)}. Rebuild the data with <code>python -m src.dashboard</code>.</div>`); }
}
function boot() {
  if (!D || D.schema !== 1 || !D.bots) {
    $("#filters").hidden = true; $("#context").hidden = true;
    $("#app").innerHTML = `<div class="err"><b>No dashboard data.</b> This file is the template. Build the dashboard with <code>python -m src.dashboard</code> and open <code>reports/dashboard.html</code>.</div>`; return;
  }
  initFilters();
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });
  render();
}
boot();
</script>
