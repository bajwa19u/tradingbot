name: BR V1 daily report
# After the close: replay today on SIP bars with the backtest code, draw every
# trade's screenshots, compare with what the live job sent, write
# reports/br_v1/daily/<date>.md, extend reports/br_v1/forward.csv, and post a
# one-line summary to the BR channel. Off until br-v1 is merged (schedules
# only run from the default branch). Two cron times for daylight saving; the
# script exits if the session is not over yet.
on:
  schedule:
    - cron: "35 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (blank = today)", default: "" }
      no_post: { description: "do not post the summary", type: boolean, default: false }

concurrency:
  group: br-daily
  cancel-in-progress: false

permissions: { contents: write }

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Replay and report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_BR_WEBHOOK_URL: ${{ secrets.DISCORD_BR_WEBHOOK_URL }}
          IN_DATE: ${{ inputs.date }}
          IN_NOPOST: ${{ inputs.no_post }}
        run: |
          ARGS=()
          if [ -n "${IN_DATE:-}" ]; then ARGS+=(--date "$IN_DATE"); fi
          if [ "${IN_NOPOST:-false}" = "true" ]; then ARGS+=(--no-post); fi
          python -m src.br_daily "${ARGS[@]}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/br_v1 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "br v1: daily report [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
