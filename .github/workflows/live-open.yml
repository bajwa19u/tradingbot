name: Live bot — the open

# The opening window, covered by POLLING rather than by cron.
#
# GitHub's scheduled workflows are routinely several minutes late. That is
# survivable at 11am and useless at 09:31, which is exactly when the rule
# this job exists for fires. So cron only has to be roughly on time once: it
# starts this job before the bell, and the job then checks every forty-five
# seconds on its own clock until 10:05 ET.
#
# START EARLY, THEN WAIT. This job exists because GitHub's scheduler is
# routinely minutes late, and on 29 September it proved the point by not
# starting this job at all at 13:20 - the bot only covered the open because
# it was dispatched by hand at 09:25 Eastern. A job whose whole purpose is to
# beat cron delay must not depend on cron being punctual.
#
# So it now starts around 08:47 Eastern and sleeps until the bell on its own
# clock. Fifteen minutes of scheduler drift costs nothing; it just waits
# fifteen minutes less.
#
# The 13:xx and 14:xx pairs are the same time in summer and winter - UTC has
# no daylight-saving awareness - and the one that is wrong for the season
# starts, sees it is past 10:05 Eastern, and exits in seconds. The later pair
# is a backstop for a skipped first firing; if the first is still polling,
# this one queues behind it and then exits immediately.
#
# Shares a concurrency group with the five-minute job on purpose: both write
# the same record of what has already been announced, and two of them running
# at once is how the same trade gets posted to Discord twice.
on:
  schedule:
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "07 13 * * 1-5"
    - cron: "07 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the messages instead of sending them"
        type: boolean
        default: false
      until:
        description: "Poll until this Eastern time"
        required: false
        default: "10:05"
      every:
        description: "Seconds between checks"
        required: false
        default: "45"
      force:
        description: "Ignore the market-hours check"
        type: boolean
        default: false

concurrency:
  group: live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Poll the open
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_UNTIL: ${{ inputs.until }}
          IN_EVERY: ${{ inputs.every }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          mkdir -p reports state
          touch /tmp/runmark
          ARGS=(--until "${IN_UNTIL:-10:05}" --every "${IN_EVERY:-45}" --stream)
          if [ "${IN_DRY:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${IN_FORCE:-false}" = "true" ]; then ARGS+=(--force); fi
          set +e
          python -m src.live_bot "${ARGS[@]}" 2>&1 | tee reports/live_open.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit what was announced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports state
          # Take the remote as the base and lay this run's files on top: a
          # rebase is the wrong tool for generated output, because two runs
          # touching the same log conflict and the results are lost.
          #
          # ONLY files this run actually wrote. Copying the whole of state/
          # meant a run that did nothing still laid its own stale checkout
          # over whatever a concurrent run had just committed - on
          # 30 September that wiped ten Discord message ids and the next run
          # posted all ten trades a second time. The marker is dropped before
          # the scan, so "newer than the marker" is exactly this run's output.
          rm -rf /tmp/out && mkdir -p /tmp/out
          find reports state -type f -newer /tmp/runmark -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                mkdir -p "/tmp/out/$(dirname "$f")"; cp -a "$f" "/tmp/out/$f"
              done
          if [ -z "$(find /tmp/out -type f 2>/dev/null)" ]; then
            echo "this run wrote nothing — leaving the repo alone"; exit 0
          fi
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports state
            cp -a /tmp/out/. .
            git add reports state
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "live: the open [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/live_today.md ]; then
            cat reports/live_today.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 30 reports/live_open.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
