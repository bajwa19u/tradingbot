name: Day-trade trial run
# Manual. Replays a day with a day-trade rule and, if asked, posts it to the
# day-trade channel under a TRIAL banner. Never touches the live bot's record.
on:
  workflow_dispatch:
    inputs:
      strategy: { description: "bigtech or inplay_orb", default: "bigtech" }
      date: { description: "YYYY-MM-DD; blank = today", default: "" }
      post: { description: "Send to Discord", type: boolean, default: false }
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Trial
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          S: ${{ inputs.strategy }}
          D: ${{ inputs.date }}
          P: ${{ inputs.post }}
        run: python -m src.orb_trial --strategy "$S" ${D:+--date "$D"} $( [ "$P" = "true" ] && echo --post )
