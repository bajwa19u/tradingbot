name: Channel stats
# Manual. What each day-trade Discord channel's rule would have done over the
# last week, month and three months. Writes reports/channel_stats.json.
# Posts nothing, trades nothing.
on: workflow_dispatch
permissions: { contents: write }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache/minute_iex_wide.pkl
          key: minute-iex-wide-${{ github.run_id }}
          restore-keys: minute-iex-wide-
      - run: python -m src.channel_stats
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/channel_stats.json reports/channel_trades.json
          git diff --cached --quiet || (git commit -m "channel stats [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done)
