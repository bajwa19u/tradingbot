name: Stocks in play

# Testing the part of the published work we left out.
#
# Zarattini, Barbon and Aziz ran a five-minute opening-range breakout across
# 7,000+ US equities. Applied broadly it returned 29% against 198% for simply
# holding the index. Restricted to the twenty names with the most abnormal
# opening volume, the same rule returned 1,637% - and the paper says plainly
# that most of the edge came from the selection, not the breakout.
#
# Our version had no selection at all, which is the version the research says
# does not work. This measures whether adding it changes anything on our data,
# our feed and our costs. Measurement only; nothing here alerts or is
# scheduled.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days of history"
        required: false
        default: "60"
      universe:
        description: "wide | movers | research | holdout | fresh | core"
        required: false
        default: "wide"
      symbols:
        description: "Comma-separated symbols (overrides universe)"
        required: false
        default: ""
      slippage:
        description: "Percent each way. 0.05 is the optimistic assumption."
        required: false
        default: "0.05"
      stops:
        description: "ATR fractions to test, e.g. 0.2,0.3,0.5"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: inplay
  cancel-in-progress: false

jobs:
  inplay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Measure
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_DAYS: ${{ inputs.days }}
          IN_UNI: ${{ inputs.universe }}
          IN_SYM: ${{ inputs.symbols }}
          IN_SLIP: ${{ inputs.slippage }}
          IN_STOPS: ${{ inputs.stops }}
        run: |
          set -uo pipefail
          mkdir -p reports
          rm -f reports/inplay.md reports/inplay.json
          ARGS=(--days "${IN_DAYS:-60}" --universe "${IN_UNI:-wide}" \
                --slippage "${IN_SLIP:-0.05}")
          [ -n "${IN_SYM:-}" ] && ARGS+=(--symbols "${IN_SYM}") || true
          [ -n "${IN_STOPS:-}" ] && ARGS+=(--stops "${IN_STOPS}") || true
          set +e
          python -m src.inplay "${ARGS[@]}" 2>&1 | tee reports/inplay_run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          rm -rf /tmp/out && mkdir -p /tmp/out
          for d in reports; do cp -a "$d" "/tmp/out/$d"; done
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports
            for d in reports; do cp -a "/tmp/out/$d/." "$d/"; done
            git add reports
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "inplay: results [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/inplay.md ]; then
            cat reports/inplay.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 40 reports/inplay_run.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
