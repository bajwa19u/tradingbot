name: Paper account — what actually filled

# Reads the Alpaca paper account itself: every fill, matched into closed
# round trips, grouped by day. Not a simulation — if an order filled at a
# worse price than the backtest assumed, this is where that shows up.
#
# Read-only. It places nothing and cancels nothing, and a test enforces that.
#
# Runs through the session so the dashboard can show real fills alongside the
# bot's paper record, and once more after the close.

on:
  # schedule off: automatic trading turned off 2026-10-01 (signals only)
  # - cron: "20 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      after:
        description: "Only fills after this date (YYYY-MM-DD), blank for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: account
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read the account
        id: run
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_AFTER: ${{ inputs.after }}
        run: |
          set -uo pipefail
          mkdir -p reports
          ARGS=()
          [ -n "${IN_AFTER:-}" ] && ARGS+=(--after "${IN_AFTER}") || true
          set +e
          python -m src.account "${ARGS[@]}" 2>&1 | tee reports/account.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -a reports /tmp/out/reports
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports
            cp -a /tmp/out/reports/. reports/
            git add reports
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "account: real fills [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/account.md ]; then
            cat reports/account.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 30 reports/account.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
