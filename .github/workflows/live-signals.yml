name: Live signals

# Runs every 5 minutes through the US market day. The cron window is
# deliberately wide (UTC has no daylight-saving awareness); the script itself
# checks the real Eastern time and exits immediately outside 09:30-16:00 ET.
# SCHEDULE DISABLED 2026-09-26.
#
# This fired every 5 minutes on the intraday break-and-retest strategy, which
# measured -0.234R per trade over 942 trades and -87% drawdown. Leaving it on
# was sending alerts for a setup we had already proven loses money, and
# burning Actions minutes to do it.
#
# Re-enable by uncommenting the schedule below - but only for a strategy that
# has survived a forward test, not a backtest.
on:
  # schedule:
  #   - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print signals instead of sending them"
        type: boolean
        default: false

concurrency:
  group: live-signals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for break-and-retest setups
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m src.run_live ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Remember which signals were already sent
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "tradingbot"
            git config user.email "tradingbot@users.noreply.github.com"
            git add state/
            git commit -m "chore: record sent signals [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
