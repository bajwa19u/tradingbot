name: Stop width

# Would a wider stop have saved the losers, and does a different target help?
#
# Looking at one loser and noting that price came back is hindsight. This
# runs the same rule with more room on the stop across every trade, so the
# rescues and the extra damage get counted together - a stop pushed further
# out turns some losses into wins and makes every loss it does not rescue
# more expensive.
#
# Measurement only. Nothing here alerts and nothing is scheduled.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days of history"
        required: false
        default: "60"
      universe:
        description: "core | movers | research | holdout | fresh | wide"
        required: false
        default: "core"
      date:
        description: "One day to break down in detail (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: widths
  cancel-in-progress: false

jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Measure
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_DAYS: ${{ inputs.days }}
          IN_UNI: ${{ inputs.universe }}
          IN_DATE: ${{ inputs.date }}
        run: |
          set -uo pipefail
          mkdir -p reports
          rm -f reports/widths.md reports/widths.json
          ARGS=(--days "${IN_DAYS:-60}" --universe "${IN_UNI:-core}")
          [ -n "${IN_DATE:-}" ] && ARGS+=(--date "${IN_DATE}") || true
          set +e
          python -m src.widths "${ARGS[@]}" 2>&1 | tee reports/widths_run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          rm -rf /tmp/out && mkdir -p /tmp/out
          for d in reports; do cp -a "$d" "/tmp/out/$d"; done
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports
            for d in reports; do cp -a "/tmp/out/$d/." "$d/"; done
            git add reports
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "widths: results [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/widths.md ]; then
            cat reports/widths.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 40 reports/widths_run.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
