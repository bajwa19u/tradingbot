name: Pre-earnings — the two-gate screen

# Research, not a bot. Nothing here posts to Discord and nothing here trades.
# It downloads filings and prices, applies both gates, and writes a report
# for a human to read before anything is built on top of it.
#
# It is slow - a few hundred megabytes of SEC company-facts files - so it
# runs only when asked. The facts are cached between steps of a single run
# but not between runs; the SEC is fine with that at this volume.

on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Select on reports up to this date; test everything after"
        required: false
        default: "2022-12-31"
      windows:
        description: "Trading days held, comma separated"
        required: false
        default: "21,42,63"
      equity:
        description: "Account size for the portfolio simulation"
        required: false
        default: "2000"
      max_open:
        description: "How many positions can be open at once"
        required: false
        default: "3"
      symbols:
        description: "Override the universe (comma separated), for testing"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: preearn-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Screen
        id: run
        env:
          IN_CUTOFF: ${{ inputs.cutoff }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_EQUITY: ${{ inputs.equity }}
          IN_MAXOPEN: ${{ inputs.max_open }}
          IN_SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -uo pipefail
          mkdir -p reports
          # Never let a previous run's report be read as this one's.
          rm -f reports/preearn_screen.md
          ARGS=(--cutoff "${IN_CUTOFF:-2022-12-31}" \
                --windows "${IN_WINDOWS:-21,42,63}" \
                --equity "${IN_EQUITY:-2000}" \
                --max-open "${IN_MAXOPEN:-3}")
          [ -n "${IN_SYMBOLS:-}" ] && ARGS+=(--symbols "${IN_SYMBOLS}") || true
          set +e
          python -m src.preearn_screen "${ARGS[@]}" 2>&1 \
            | tee reports/preearn_screen.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -a reports /tmp/out/reports
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports
            cp -a /tmp/out/reports/. reports/
            git add reports
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "pre-earnings: the two-gate screen [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/preearn_screen.md ]; then
            cat reports/preearn_screen.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 40 reports/preearn_screen.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
