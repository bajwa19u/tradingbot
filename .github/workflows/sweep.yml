name: Sweep

# Tests many rule sets against the same bars in one run, so each rule can be
# priced individually. Manual only - it fetches 1-minute data and is slow.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2024-06-01"
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      symbols:
        description: "Comma-separated symbols"
        required: false
        default: "TSLA,NVDA,AAPL,AMD"
      timeframes:
        description: "Comma-separated minutes to test"
        required: false
        default: "1,2,5"
      periods:
        description: "How many consecutive market periods to score separately"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

      - name: Sweep
        id: sw
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_SYMBOLS: ${{ inputs.symbols }}
          IN_TF: ${{ inputs.timeframes }}
          IN_PERIODS: ${{ inputs.periods }}
        run: |
          set -uo pipefail
          mkdir -p reports
          ARGS=(--start "${IN_START:-2024-06-01}" --symbols "${IN_SYMBOLS:-TSLA,NVDA,AAPL,AMD}" --timeframes "${IN_TF:-1,2,5}" --periods "${IN_PERIODS:-5}")
          [ -n "${IN_END:-}" ] && ARGS+=(--end "${IN_END}") || true
          set +e
          python -m src.sweep "${ARGS[@]}" 2>&1 | tee reports/sweep_run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name  "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "sweep: results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "push failed"
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f reports/history.md ]; then
            { echo "## Run history"; echo; cat reports/history.md; echo; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/sweep.md ]; then
            cat reports/sweep.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 40 reports/sweep_run.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the sweep failed
        if: always()
        run: |
          [ "${{ steps.sw.outputs.code }}" = "0" ] || exit 1
