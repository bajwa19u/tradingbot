name: Day-trade research
# Manual: the live day-trade rules on 12 months of IEX minute bars, then one
# change at a time (train / validation / test by date). Writes
# reports/day_research.md. Nothing is posted, nothing is traded.
on:
  workflow_dispatch:
    inputs:
      days: { description: "trading sessions", default: "252" }
      refresh: { description: "re-download all bars", type: boolean, default: false }
permissions: { contents: write }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/minute_iex.pkl
          key: minute-iex-${{ github.run_id }}
          restore-keys: minute-iex-
      - run: python -m src.day_research --days "${{ inputs.days }}" ${{ inputs.refresh && '--refresh' || '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/day_research.md reports/day_research.json
          git diff --cached --quiet || (git commit -m "day research [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done)
