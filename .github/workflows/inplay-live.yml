name: In play — live

# The second channel. A different question from the main feed: that one asks
# whether a break is good on a fixed list of ten megacaps, this one asks what
# is worth watching at all this morning and only then looks for a break.
#
# Polling, not cron, for the same reason as the opening job - GitHub's
# scheduler is routinely minutes late and throttles frequent schedules to
# roughly twenty minutes under load. It starts before the bell, sleeps until
# 09:30 on its own clock, then checks every sixty seconds.
#
# Its own concurrency group. It writes its own record and posts to its own
# webhook, so it has no reason to queue behind the main bot.
#
# Back on 2 October at the owner's request: it posts to its own channel
# (DISCORD_WEBHOOK_INPLAY). Signals only. Entries first seen more than two
# minutes after their bar closed post as EXPIRED.
on:
  schedule:
    # Before the bell in both EDT and EST, plus afternoon takeovers: each run
    # hands over after --for minutes and the queued run continues to the close.
    - cron: "20 13,14 * * 1-5"
    - cron: "0,20 18,19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the messages instead of sending them"
        type: boolean
        default: false
      until:
        description: "Poll until this Eastern time"
        required: false
        default: "13:30"
      every:
        description: "Seconds between checks"
        required: false
        default: "60"
      force:
        description: "Ignore the market-hours check"
        type: boolean
        default: false

concurrency:
  group: inplay-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inplay:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scan and alert
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          DISCORD_WEBHOOK_INPLAY: ${{ secrets.DISCORD_WEBHOOK_INPLAY }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_UNTIL: ${{ inputs.until }}
          IN_EVERY: ${{ inputs.every }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          mkdir -p reports state
          touch /tmp/runmark
          ARGS=(--until "${IN_UNTIL:-16:05}" --every "${IN_EVERY:-60}" --for 310)
          if [ "${IN_DRY:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${IN_FORCE:-false}" = "true" ]; then ARGS+=(--force); fi
          set +e
          python -m src.inplay_bot "${ARGS[@]}" 2>&1 | tee reports/inplay_live.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit what was announced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports state
          # Only files this run actually wrote — a run that did nothing must
          # not lay its stale checkout over whatever a concurrent run just
          # committed. That mistake wiped ten message ids on 30 September.
          rm -rf /tmp/out && mkdir -p /tmp/out
          find reports state -type f -newer /tmp/runmark -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                mkdir -p "/tmp/out/$(dirname "$f")"; cp -a "$f" "/tmp/out/$f"
              done
          if [ -z "$(find /tmp/out -type f 2>/dev/null)" ]; then
            echo "this run wrote nothing — leaving the repo alone"; exit 0
          fi
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports state
            cp -a /tmp/out/. .
            git add reports state
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "inplay: session state [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/inplay_today.md ]; then
            cat reports/inplay_today.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 30 reports/inplay_live.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
