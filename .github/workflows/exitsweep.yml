name: Exit rules — the sweep

# Which way out keeps the money. Research only: nothing here trades, and
# nothing here posts to Discord.
#
# Every variant takes the same entries at the same prices; only the exit
# changes. Chosen on the explore dates, judged on a holdout that chose
# nothing.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days of history to pull"
        required: false
        default: "60"
      universe:
        description: "Which symbol list (bigtech, core, live, wide)"
        required: false
        default: "bigtech"
      symbols:
        description: "Override the universe, comma separated"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: exitsweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sweep
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          IN_DAYS: ${{ inputs.days }}
          IN_UNI: ${{ inputs.universe }}
          IN_SYM: ${{ inputs.symbols }}
        run: |
          set -uo pipefail
          mkdir -p reports
          # A previous run's report must never be mistaken for this one's.
          rm -f reports/exitsweep.md reports/exitsweep.json
          ARGS=(--days "${IN_DAYS:-120}" --universe "${IN_UNI:-bigtech}")
          [ -n "${IN_SYM:-}" ] && ARGS+=(--symbols "${IN_SYM}") || true
          set +e
          python -m src.exitsweep "${ARGS[@]}" 2>&1 | tee reports/exitsweep.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -a reports /tmp/out/reports
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports
            cp -a /tmp/out/reports/. reports/
            git add reports
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "exit sweep: results [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f reports/exitsweep.md ]; then
            cat reports/exitsweep.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 40 reports/exitsweep.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
