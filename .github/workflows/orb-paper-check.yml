name: ORB paper - check one day

# Settles one past session from scratch with the paper feed and prints it.
# Writes nothing. Used to prove the live data path outside market hours.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session (YYYY-MM-DD); blank = today"
        required: false
        default: ""
      why:
        description: "Explain one symbol (e.g. TSLA) instead of settling the day"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          D: ${{ inputs.date }}
          WHY: ${{ inputs.why }}
        run: python -m src.orb_paper --check ${D:+--date "$D"} ${WHY:+--why "$WHY"}
      - name: Live bot with the in-play ORB flag on (dry run, posts nothing)
        if: ${{ inputs.why == '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DAYTRADE_STRATEGY: inplay_orb
        run: python -m src.live_bot --dry-run --force
