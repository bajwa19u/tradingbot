name: ORB stocks-in-play research
# Manual: ORB on daily stocks-in-play selections, staged one change at a time
# (train / validation / untouched test by date). Writes
# reports/orb_research.md. Nothing is posted, nothing is traded.
on:
  workflow_dispatch:
    inputs:
      days: { description: "trading sessions", default: "252" }
      refresh: { description: "re-download all bars", type: boolean, default: false }
permissions: { contents: write }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/minute_iex_wide.pkl
          key: minute-iex-wide-${{ github.run_id }}
          restore-keys: minute-iex-wide-
      - run: python -m src.orb_research --days "${{ inputs.days }}" ${{ inputs.refresh && '--refresh' || '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/orb_research.md reports/orb_research.json
          git diff --cached --quiet || (git commit -m "day research [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done)
