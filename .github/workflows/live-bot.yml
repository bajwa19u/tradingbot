name: Live bot

# THE DEPLOYED BOT. Break and retest, shorts only, core watchlist.
#
# Every five minutes through the session: posts an entry the moment the rule
# fires, a close when the trade ends, and one summary after the bell.
#
# The cron window is wide because UTC has no daylight-saving awareness; the
# script checks real Eastern time and exits outside 09:45-16:10.
#
# It replays the whole day on every run and tracks what it has already
# announced, so a missed run, a duplicate run or a crash cannot corrupt the
# record - the next run recomputes the same day and posts whatever is new.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the messages instead of sending them"
        type: boolean
        default: false
      force:
        description: "Ignore the market-hours check"
        type: boolean
        default: false

concurrency:
  group: live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and alert
        id: run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          mkdir -p reports state
          touch /tmp/runmark
          ARGS=()
          if [ "${IN_DRY:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${IN_FORCE:-false}" = "true" ]; then ARGS+=(--force); fi
          set +e
          python -m src.live_bot "${ARGS[@]}" 2>&1 | tee reports/live_bot.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit what was announced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports state
          # Take the remote as the base and lay this run's files on top: a
          # rebase is the wrong tool for generated output, because two runs
          # touching the same log conflict and the results are lost.
          #
          # ONLY files this run actually wrote. Copying the whole of state/
          # meant a run that did nothing still laid its own stale checkout
          # over whatever a concurrent run had just committed - on
          # 30 September that wiped ten Discord message ids and the next run
          # posted all ten trades a second time. The marker is dropped before
          # the scan, so "newer than the marker" is exactly this run's output.
          rm -rf /tmp/out && mkdir -p /tmp/out
          find reports state -type f -newer /tmp/runmark -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                mkdir -p "/tmp/out/$(dirname "$f")"; cp -a "$f" "/tmp/out/$f"
              done
          if [ -z "$(find /tmp/out -type f 2>/dev/null)" ]; then
            echo "this run wrote nothing — leaving the repo alone"; exit 0
          fi
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports state
            cp -a /tmp/out/. .
            git add reports state
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "live: session state [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push results after 5 attempts"
          exit 1
      - name: Summary
        if: always()
        run: |
          if [ -f reports/live_today.md ]; then
            cat reports/live_today.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 25 reports/live_bot.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail if the run failed
        if: always() && steps.run.outputs.code != '0'
        run: exit 1
