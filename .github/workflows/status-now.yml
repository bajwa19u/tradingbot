name: Status now
# Manual. Where both day-trade channels stand right now: today's trades,
# closed results and open trades marked to the latest bar. Prints only.
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.status_now | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DAYTRADE_STRATEGY: ${{ vars.DAYTRADE_STRATEGY }}
