name: Backtest

# Runs every Saturday morning, and any time you click "Run workflow".
# Results are committed to reports/latest.md so the history of how the
# strategy performed under each set of rules stays in the repo.
on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      symbols:
        description: "Comma-separated symbols (blank = config watchlist)"
        required: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets are present
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          missing=0
          if [ -z "${ALPACA_API_KEY}" ]; then
            echo "::error::ALPACA_API_KEY secret is not set"
            missing=1
          fi
          if [ -z "${ALPACA_API_SECRET}" ]; then
            echo "::error::ALPACA_API_SECRET secret is not set"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "Add them at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Alpaca credentials present."

      - name: Run the unit tests first
        run: python -m pytest tests/ -q

      - name: Backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          # Inputs go through the environment rather than being pasted into
          # the script, so a blank field cannot break the shell and a stray
          # character cannot be executed.
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${IN_START:-}" ]   && ARGS+=(--start   "${IN_START}")   || true
          [ -n "${IN_END:-}" ]     && ARGS+=(--end     "${IN_END}")     || true
          [ -n "${IN_SYMBOLS:-}" ] && ARGS+=(--symbols "${IN_SYMBOLS}") || true
          echo "Running: python -m src.run_backtest ${ARGS[*]:-(config defaults)}"
          python -m src.run_backtest ${ARGS[@]+"${ARGS[@]}"}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: reports/
          if-no-files-found: ignore

      - name: Commit the report
        run: |
          if [[ -n "$(git status --porcelain reports/)" ]]; then
            git config user.name  "tradingbot"
            git config user.email "tradingbot@users.noreply.github.com"
            git add reports/
            git commit -m "backtest: refresh results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced - see the Backtest step log above." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
