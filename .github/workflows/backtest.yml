name: Backtest

# Runs every Saturday morning, and any time you click "Run workflow".
# Results are committed to reports/latest.md so the history of how the
# strategy performed under each set of rules stays in the repo.
on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      symbols:
        description: "Comma-separated symbols (blank = config watchlist)"
        required: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the unit tests first
        run: python -m pytest tests/ -q

      - name: Backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          ARGS=""
          [ -n "${{ inputs.start }}" ]   && ARGS="$ARGS --start ${{ inputs.start }}"
          [ -n "${{ inputs.end }}" ]     && ARGS="$ARGS --end ${{ inputs.end }}"
          [ -n "${{ inputs.symbols }}" ] && ARGS="$ARGS --symbols ${{ inputs.symbols }}"
          python -m src.run_backtest $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/

      - name: Commit the report
        run: |
          if [[ -n "$(git status --porcelain reports/)" ]]; then
            git config user.name  "tradingbot"
            git config user.email "tradingbot@users.noreply.github.com"
            git add reports/
            git commit -m "backtest: refresh results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Summary
        run: cat reports/latest.md >> $GITHUB_STEP_SUMMARY
