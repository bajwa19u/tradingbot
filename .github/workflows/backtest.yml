name: Backtest

# Runs every Saturday morning, and any time you click "Run workflow".
#
# Everything the run prints is captured to reports/last_run.log and committed
# back to the repo, so a failure can be read straight from the repository
# instead of dug out of the Actions log viewer.
on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      symbols:
        description: "Comma-separated symbols (blank = config watchlist)"
        required: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the unit tests first
        run: python -m pytest tests/ -q

      - name: Diagnose the data connection
        id: diag
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          mkdir -p reports
          set +e
          python -m tools.diagnose 2>&1 | tee reports/last_run.log
          echo "diag_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Backtest
        id: bt
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -uo pipefail
          ARGS=()
          [ -n "${IN_START:-}" ]   && ARGS+=(--start   "${IN_START}")   || true
          [ -n "${IN_END:-}" ]     && ARGS+=(--end     "${IN_END}")     || true
          [ -n "${IN_SYMBOLS:-}" ] && ARGS+=(--symbols "${IN_SYMBOLS}") || true
          {
            echo ""
            echo "============================================================"
            echo "BACKTEST"
            echo "============================================================"
            echo "args: ${ARGS[*]:-(config defaults)}"
          } >> reports/last_run.log
          set +e
          python -m src.run_backtest ${ARGS[@]+"${ARGS[@]}"} 2>&1 \
            | tee -a reports/last_run.log
          code=${PIPESTATUS[0]}
          echo "bt_exit=${code}" >> "$GITHUB_OUTPUT"
          echo "" >> reports/last_run.log
          echo "exit code: ${code}" >> reports/last_run.log

      - name: Commit the log and any report
        if: always()
        run: |
          git config user.name  "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "backtest: run log and results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "push failed - log is still in the artifact"
          else
            echo "nothing to commit"
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backtest-report
          path: reports/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            if [ -f reports/latest.md ]; then
              cat reports/latest.md
            else
              echo "## Backtest did not produce a report"
              echo ""
              echo "Full log committed to \`reports/last_run.log\`."
              echo ""
              echo '```'
              tail -n 60 reports/last_run.log 2>/dev/null || echo "(no log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the backtest failed
        if: always()
        run: |
          if [ "${{ steps.bt.outputs.bt_exit }}" != "0" ]; then
            echo "::error::Backtest exited ${{ steps.bt.outputs.bt_exit }} - see reports/last_run.log"
            exit 1
          fi
