name: Day end (catch-up)
# After the close: one pass of each day-trade bot, so the 15:55 exits and the
# daily summaries still post if the session jobs died or never started (GitHub
# Actions outage, 5 Oct 2026). Nothing is posted twice: each bot keeps a record
# of what it has announced, and a pass with nothing new sends nothing.
# Runs at 16:20, 17:20 and 18:20 Eastern in daylight time (an hour earlier in
# winter; the first of those then lands before the close and simply acts as one
# more ordinary check).
on:
  schedule:
    - cron: "20 20,21,22 * * 1-5"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Day-trade rule to finish today with (blank = what the day started on)"
        required: false
        default: ""
      dry_run:
        description: "Print instead of posting"
        type: boolean
        default: false

# Same queue as the live jobs: this runs src.live_bot and writes the same
# record (state/live_bot_seen.json). In its own group it could run beside a
# late live-bot run and the second to save would overwrite the first.
concurrency:
  group: live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The branch's LATEST commit, not the one this run was queued on. A run
      # that waits in the concurrency queue otherwise starts from state that is
      # minutes old: on 5 Oct the job queued at 10:03 started after the open
      # job saved at 10:05, re-posted MSFT/BAC/NVDA as EXPIRED and overwrote
      # their Discord card ids, so the on-time cards never got their results.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Finish the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_INPLAY: ${{ secrets.DISCORD_WEBHOOK_INPLAY }}
          DAYTRADE_STRATEGY: ${{ inputs.strategy || vars.DAYTRADE_STRATEGY }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          mkdir -p reports state
          touch /tmp/runmark
          DRY=(); if [ "${IN_DRY:-false}" = "true" ]; then DRY=(--dry-run); fi
          python -m src.live_bot --force "${DRY[@]}" 2>&1 | tee reports/day_end_live.log
          python -m src.inplay_bot --force "${DRY[@]}" 2>&1 | tee reports/day_end_inplay.log
      - name: Commit what was announced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/out && mkdir -p /tmp/out
          find reports state -type f -newer /tmp/runmark -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                mkdir -p "/tmp/out/$(dirname "$f")"; cp -a "$f" "/tmp/out/$f"
              done
          if [ -z "$(find /tmp/out -type f 2>/dev/null)" ]; then echo "nothing written"; exit 0; fi
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p reports state
            cp -a /tmp/out/. .
            git add reports state
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "day end: catch-up [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
