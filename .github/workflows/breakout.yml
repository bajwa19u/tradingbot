name: Breakout

# Expansion out of a volatility contraction - enter as a trend begins.
# Built from the 2026 forensics finding, not from a parameter search.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date trades may be taken"
        required: false
        default: "2026-01-01"
      end:
        description: "Last date (blank = today)"
        required: false
      periods:
        description: "Market periods to score separately"
        required: false
        default: "3"
      only:
        description: "Run ONE named config, no search (e.g. base10_sq4.0_vol1.0_atr0.0)"
        required: false
      vol_split:
        description: "Also score the loud and quiet halves separately"
        type: boolean
        default: false
      min_atr_pct:
        description: "Drop symbols quieter than this %% typical daily range (0 = keep all)"
        required: false
        default: "0"
      universe:
        description: "movers | research | holdout | wide (all three, for the volatility split)"
        required: false
        default: "movers"

permissions:
  contents: write

jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Search
        id: go
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_PERIODS: ${{ inputs.periods }}
          IN_UNI: ${{ inputs.universe }}
          IN_ONLY: ${{ inputs.only }}
          IN_SPLIT: ${{ inputs.vol_split }}
          IN_MINATR: ${{ inputs.min_atr_pct }}
        run: |
          set -uo pipefail
          mkdir -p reports
          ARGS=(--start "${IN_START:-2026-01-01}" --periods "${IN_PERIODS:-3}" \
                --universe "${IN_UNI:-movers}")
          [ -n "${IN_END:-}" ] && ARGS+=(--end "${IN_END}") || true
          [ -n "${IN_ONLY:-}" ] && ARGS+=(--only "${IN_ONLY}") || true
          [ "${IN_SPLIT:-false}" = "true" ] && ARGS+=(--vol-split) || true
          [ -n "${IN_MINATR:-}" ] && [ "${IN_MINATR}" != "0" ] && ARGS+=(--min-atr-pct "${IN_MINATR}") || true
          set +e
          python -m src.breakout "${ARGS[@]}" 2>&1 | tee reports/breakout_run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: always()
        run: |
          git config user.name  "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "breakout: results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "push failed"
          fi
      - name: Summary
        if: always()
        run: |
          if [ -f reports/breakout.md ]; then cat reports/breakout.md >> "$GITHUB_STEP_SUMMARY"; else
            { echo '```'; tail -n 40 reports/breakout_run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail if the run failed
        if: always()
        run: '[ "${{ steps.go.outputs.code }}" = "0" ] || exit 1'
