name: Discover

# Wide search across every strategy family and parameter set, then ONE run
# against a locked holdout (different symbols, earlier period) that nothing
# in the search has touched.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Research start date (YYYY-MM-DD)"
        required: false
        default: "2024-06-01"
      end:
        description: "Research end date (YYYY-MM-DD)"
        required: false
      symbols:
        description: "Research symbols (must NOT overlap the holdout)"
        required: false
        default: "TSLA,NVDA,AAPL,AMD"
      timeframe:
        description: "Bar size in minutes"
        required: false
        default: "5"
      periods:
        description: "Market periods to score separately"
        required: false
        default: "4"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

      - name: Search
        id: go
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_SYMBOLS: ${{ inputs.symbols }}
          IN_TF: ${{ inputs.timeframe }}
          IN_PERIODS: ${{ inputs.periods }}
        run: |
          set -uo pipefail
          mkdir -p reports
          ARGS=(--start "${IN_START:-2024-06-01}" \
                --symbols "${IN_SYMBOLS:-TSLA,NVDA,AAPL,AMD}" \
                --timeframe "${IN_TF:-5}" --periods "${IN_PERIODS:-4}")
          [ -n "${IN_END:-}" ] && ARGS+=(--end "${IN_END}") || true
          set +e
          python -m src.discover "${ARGS[@]}" 2>&1 | tee reports/discover_run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name  "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "discover: wide search results [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "push failed"
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: discovery
          path: reports/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ -f reports/discovery.md ]; then
            cat reports/discovery.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; tail -n 50 reports/discover_run.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the search failed
        if: always()
        run: |
          [ "${{ steps.go.outputs.code }}" = "0" ] || exit 1
