# ============================================================================
#  TradingBot configuration  —  THIS IS THE ONLY FILE YOU NEED TO EDIT
# ============================================================================
#  Change a number, commit, push. The bot picks it up on its next run.
#  Every rule below is enforced strictly: if a condition fails, no trade.
# ============================================================================

mode: signals_only          # signals_only | paper | live   (paper/live = future)

# ---------------------------------------------------------------------------
# What to scan
# ---------------------------------------------------------------------------
universe:
  # Always-scanned core names
  watchlist: [TSLA, NVDA, AAPL, AMD]   # the four names the method names

  # Add the day's most active / highest relative-volume movers
  include_top_movers: true
  top_movers_count: 10

  # A stock must pass ALL of these to be scanned at all
  min_price: 5.0
  max_price: 1000.0
  min_avg_daily_volume: 2_000_000   # 20-day average shares
  min_relative_volume: 1.5          # today's volume pace vs 20-day average
  min_atr_pct: 0.8                  # 14-day ATR as % of price — needs to move
  max_spread_pct: 0.15              # skip illiquid / wide-spread names

# ---------------------------------------------------------------------------
# The strategy — Scarface Trades style 5-minute opening-range break & retest
# ---------------------------------------------------------------------------
strategy:
  timeframe_minutes: 5

  session:
    market_open: "09:30"
    market_close: "16:00"
    opening_range_minutes: 5      # the FIRST 5-min candle, per the published method
    no_entries_before: "09:35"    # once the first candle has closed
    no_entries_after: "11:00"     # the method trades the open only
    flatten_at: "15:55"           # time stop — close anything still open

  # --- Step 1: the break -----------------------------------------------------
  # NOTE: all *_atr_multiple values below are fractions of the DAILY ATR.
  # The opening range is typically 0.2-0.4 of a day's ATR.
  breakout:
    require_close_beyond: true    # candle must CLOSE beyond the level, not just wick
    min_break_pct: 0.05           # must clear the level by at least this %

    # Volume confirmation. The baseline is the average of the most recent
    # `volume_lookback_bars` bars, NOT the opening range — intraday volume
    # decays steeply after the open, so an opening-range baseline rejects
    # almost every genuine mid-morning break.
    volume_baseline: recent       # recent | opening_range
    volume_lookback_bars: 6
    volume_multiple: 1.3          # break bar volume vs that baseline

    max_range_atr_multiple: 0.45  # a one-candle range is narrower than a 15-min one
    min_range_atr_multiple: 0.03

  # --- Step 2: the retest ----------------------------------------------------
  retest:
    max_bars_after_break: 8       # retest must happen within N bars or setup expires
    min_bars_after_break: 1
    tolerance_atr_multiple: 0.08  # how close price must come back to the level
    allow_wick_only: true         # wick into the level counts as a touch
    # "Visible space on the chart": the break must travel this far (x daily
    # ATR) away from the level before a return counts as a retest. 0 = off.
    min_displacement_atr: 0.15
    invalidate_close_beyond_pct: 0.10  # close back THROUGH the level = setup dead

  # --- Step 3: the confirmation candle --------------------------------------
  confirmation:
    patterns: [hammer, engulfing]   # any of these validates the retest
    hammer_lower_wick_ratio: 2.0    # lower wick >= 2x body
    hammer_upper_wick_max_ratio: 0.8
    engulfing_min_body_ratio: 1.0   # body must fully engulf prior body
    require_volume_uptick: false    # set true for a stricter filter

  # --- Direction / trend filters --------------------------------------------
  filters:
    trade_longs: true
    trade_shorts: true
    require_vwap_alignment: true    # longs only above VWAP, shorts only below
    require_daily_trend_alignment: false  # longs only if above 20-day SMA
    max_trades_per_symbol_per_day: 1
    max_trades_per_day: 2
    stop_after_first_win: true    # the methodology stops the session after one winner

# ---------------------------------------------------------------------------
# Risk management — 2R, exactly as the methodology specifies
# ---------------------------------------------------------------------------
risk:
  account_equity: 10000.0       # used only for position sizing in the report
  risk_per_trade_pct: 1.0       # % of equity risked per trade
  max_daily_loss_R: 2.0         # stop trading for the day after -2R
  reward_multiple: 2.0          # take profit at 2R
  stop_buffer_atr_multiple: 0.03  # stop placed beyond the confirmation low by this (x daily ATR)
  partial_at_1R: false          # true = sell half at 1R
  breakeven_after_1R: true      # move stop to entry once 1R is reached
  # Cap on a single position's notional value, as a % of equity.
  # NOTE: opening-range stops are tight, so a full 1%-risk position is often
  # worth more than the account. At 100 the bot will size down to what the
  # account can actually buy and tell you the true dollar risk in the signal.
  # Raise above 100 only if you have day-trading margin and accept the risk.
  max_position_pct_of_equity: 100.0

# ---------------------------------------------------------------------------
# Backtest settings
# ---------------------------------------------------------------------------
backtest:
  start: "2023-01-01"
  end: null                     # null = up to yesterday
  symbols: null                 # null = use universe.watchlist
  slippage_pct: 0.03            # applied to entry and exit
  commission_per_share: 0.0
  bar_feed: iex                 # iex (free) or sip (paid Alpaca plan)

# ---------------------------------------------------------------------------
# Where signals go
# ---------------------------------------------------------------------------
notifications:
  channels: [discord]           # discord | telegram | email | console
  send_heartbeat: true          # daily "bot is alive, N setups watched" message
  include_chart_levels: true
